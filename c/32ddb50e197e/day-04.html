<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#0d0f12;--card:#15181d;--card2:#1a1e24;--rule:#242830;--rule2:#1e2229;
 --ink:#e8eaed;--ink2:#b4bbc4;--ink3:#8b939d;--live:#60a5fa;--up:#4ade80;--down:#f87171;
 --mono:'IBM Plex Mono',ui-monospace,monospace;--body:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);
 -webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.94);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topin{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;
 align-items:center;justify-content:space-between;gap:16px}
.back{color:var(--ink3);text-decoration:none;font:500 12px/1 var(--mono);letter-spacing:.08em}
.back:hover{color:var(--ink)}
.sess{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);text-align:right}
.sess b{color:var(--ink);font-weight:600}
.prog{height:2px;background:var(--rule2)}
.prog i{display:block;height:100%;background:var(--live);width:0;transition:width .3s}

.stage{max-width:1080px;margin:0 auto;padding:36px 24px 0}
.slide{background:var(--card);border:1px solid var(--rule);border-radius:10px;
 padding:52px 56px;min-height:440px;display:flex;flex-direction:column;justify-content:center}
.sn{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);margin:0 0 20px}
.slide h2{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:0 0 26px;font-weight:600}
.slide p{margin:0 0 15px;font-size:17px;color:var(--ink2)}
.slide p:last-child{margin-bottom:0}
.slide .shout{font-size:29px;line-height:1.28;font-weight:600;color:var(--ink);
 margin:22px 0;letter-spacing:-.01em}
.slide ul,.slide ol{margin:0 0 16px;padding-left:22px}
.slide li{margin-bottom:11px;font-size:17px;color:var(--ink2)}
.slide li::marker{color:var(--ink3)}
.slide ul li .box{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink3);
 border-radius:3px;margin-right:11px;vertical-align:-1px}
.slide blockquote{margin:22px 0;padding:2px 0 2px 20px;border-left:2px solid var(--live);
 color:var(--ink);font-size:17px}
.slide strong{color:var(--ink);font-weight:600}
.slide code{font-family:var(--mono);font-size:15px;background:var(--rule2);
 padding:2px 6px;border-radius:3px;color:var(--ink)}
.slide table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15.5px}
.slide th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
 color:var(--ink3);padding:0 16px 11px 0;border-bottom:1px solid var(--rule)}
.slide td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.slide tr:last-child td{border-bottom:none}
.slide td strong{color:var(--ink)}

.bar{max-width:1080px;margin:0 auto;padding:20px 24px 8px;display:flex;align-items:center;gap:16px}
audio{display:none}
.play{width:54px;height:54px;flex:none;border-radius:50%;border:none;cursor:pointer;
 background:var(--live);color:#04101f;display:grid;place-items:center;padding:0;
 box-shadow:0 4px 18px rgba(91,157,255,.32);transition:transform .12s,box-shadow .12s}
.play:hover{transform:scale(1.06);box-shadow:0 6px 24px rgba(91,157,255,.45)}
.play:active{transform:scale(.97)}
.play svg{fill:#04101f;pointer-events:none}
.play:disabled{background:var(--rule);box-shadow:none;cursor:default;transform:none}
.play:disabled svg{fill:var(--ink3)}
.track{flex:1;height:6px;background:var(--rule);border-radius:3px;cursor:pointer;position:relative}
.track .fill{height:100%;width:0;background:var(--live);border-radius:3px;transition:width .1s linear}
.time{font:500 13px/1 var(--mono);color:var(--ink3);min-width:42px;text-align:right;
 font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px}
button{background:var(--card);border:1px solid var(--rule);color:var(--ink);
 font:500 15px/1 var(--body);padding:14px 16px;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){background:var(--card2);border-color:var(--ink3)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);
 white-space:nowrap;cursor:pointer;user-select:none}
.auto input{accent-color:var(--live);width:15px;height:15px}

.rail{max-width:1080px;margin:0 auto;padding:14px 24px 60px;display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--rule);background:var(--card);
 color:var(--ink3);font:500 10px/1 var(--mono);cursor:pointer;display:grid;place-items:center}
.dot:hover{border-color:var(--ink3);color:var(--ink)}
.dot.on{background:var(--live);border-color:var(--live);color:#06101f;font-weight:600}
.dot.done{color:var(--ink2);border-color:var(--rule)}
@media(max-width:720px){.slide{padding:32px 24px;min-height:340px}
 .slide h2{font-size:24px}.slide .shout{font-size:22px}.stage{padding:20px 16px 0}
 .bar{flex-wrap:wrap;padding:16px}.rail{padding:12px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  </div>

</div>

<div class="stage">
  <div class="slide" id="slide"></div>
</div>

<div class="bar">
  <button class="play" id="play" aria-label="Play narration">
    <svg class="i-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5.5v13l11-6.5z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" width="22" height="22" style="display:none"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
  </button>
  <div class="track" id="track"><div class="fill" id="fill"></div></div>
  <span class="time" id="time">0:00</span>
  <div class="nav">
    <button id="prev">&larr;</button>
    <button id="next">&rarr;</button>
  </div>
  <label class="auto"><input type="checkbox" id="ap" checked> Auto</label>
  <audio id="au" preload="none"></audio>
</div>

<div class="rail" id="rail"></div>

<script>
const SL = [{"id":"1","title":"Call options","html":"<p>Day 4 of 17</p><p>The first session with real numbers in it.</p>"},{"id":"2","title":"A call, in one sentence","html":"<p class='shout'>A call gives its holder the right to <strong>buy</strong> a stock at a fixed price, until a fixed date.</p><p>Someone else is obligated to sell it to them.</p>"},{"id":"3","title":"Two sides, two businesses","html":"<table><thead><tr><th></th><th>Call buyer</th><th>Call seller</th></tr></thead><tbody><tr><td></td></tr><tr><td>Holds</td><td>The right to buy</td><td>The obligation to sell</td></tr><tr><td>Pays or receives</td><td>Pays the premium</td><td>Receives the premium</td></tr><tr><td>Wants the stock to</td><td>Rise</td><td>Not rise</td></tr><tr><td>Chooses</td><td>Yes</td><td>No</td></tr></tbody></table>"},{"id":"4","title":"The buyer's right, precisely","html":"<p>You may buy 100 shares at the strike price, any time before expiration.</p><p>You are never required to.</p><p>If the stock never gets there, you simply let it expire.</p>"},{"id":"5","title":"Reading a call","html":"<p class='shout'>NORTH 50 Call, 30 days, $2.00</p><table><thead><tr><th>Part</th><th>Means</th></tr></thead><tbody><tr><td></td></tr><tr><td>NORTH</td><td>The underlying</td></tr><tr><td>50</td><td>The strike</td></tr><tr><td>30 days</td><td>Time to expiration</td></tr><tr><td>Call</td><td>Right to buy</td></tr><tr><td>$2.00</td><td>The premium, per share</td></tr></tbody></table><p>NORTH currently trades at <strong>$50.</strong></p>"},{"id":"6","title":"What it costs","html":"<p>$2.00 \u00d7 100 shares \u00d7 1 contract = <strong>$200</strong></p><p>That $200 is:</p><ul><li>Paid up front</li><li>Gone the moment you&#x27;re filled</li><li>The <strong>most</strong> you can lose</li></ul>"},{"id":"7","title":"What a call is worth at expiration","html":"<p class='shout'>Stock price \u2212 Strike</p><p>If that&#x27;s negative, it&#x27;s worth <strong>zero.</strong></p><table><thead><tr><th>NORTH at expiry</th><th>50 call is worth</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td>$0</td></tr><tr><td>$50</td><td>$0</td></tr><tr><td>$52</td><td>$2.00 \u2192 $200</td></tr><tr><td>$55</td><td>$5.00 \u2192 $500</td></tr><tr><td>$60</td><td>$10.00 \u2192 $1,000</td></tr></tbody></table>"},{"id":"8","title":"Buying the call: every outcome","html":"<p>Paid <strong>$200.</strong></p><table><thead><tr><th>NORTH</th><th>Call worth</th><th>Your P/L</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td>$0</td><td><strong>\u2212$200</strong></td></tr><tr><td>$50</td><td>$0</td><td><strong>\u2212$200</strong></td></tr><tr><td>$52</td><td>$200</td><td><strong>$0</strong></td></tr><tr><td>$55</td><td>$500</td><td><strong>+$300</strong></td></tr><tr><td>$60</td><td>$1,000</td><td><strong>+$800</strong></td></tr></tbody></table>"},{"id":"9","title":"Break-even","html":"<p class='shout'>Strike + Premium</p><p>$50 + $2.00 = <strong>$52</strong></p><p>NORTH must rise <strong>4%</strong> in 30 days before you make a single dollar.</p><p>It&#x27;s at $50 now.</p>"},{"id":"10","title":"The shape","html":"<p><strong>Below $50:</strong> flat. You lose $200.</p><p><strong>$50 to $52:</strong> rising, still a loss.</p><p><strong>Above $52:</strong> rising. Profit.</p>"},{"id":"11","title":"The call buyer","html":"<table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>Maximum loss</td><td><strong>$200.</strong> The premium.</td></tr><tr><td>Maximum gain</td><td><strong>No fixed ceiling</strong></td></tr><tr><td>Break-even</td><td><strong>$52</strong></td></tr><tr><td>Needs</td><td>Direction <strong>and</strong> magnitude <strong>and</strong> timing</td></tr></tbody></table><blockquote>Three out of three, or you lose.</blockquote>"},{"id":"12","title":"The other side","html":"<p>Someone sold you that call.</p><p>They received <strong>$200</strong> and accepted an obligation: deliver 100 shares at $50 if asked.</p><p>Their outcomes are the exact mirror of yours.</p>"},{"id":"13","title":"Selling the call: every outcome","html":"<p>Received <strong>$200.</strong></p><table><thead><tr><th>NORTH</th><th>They owe</th><th>Their P/L</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td>$0</td><td><strong>+$200</strong></td></tr><tr><td>$50</td><td>$0</td><td><strong>+$200</strong></td></tr><tr><td>$52</td><td>$200</td><td><strong>$0</strong></td></tr><tr><td>$55</td><td>$500</td><td><strong>\u2212$300</strong></td></tr><tr><td>$60</td><td>$1,000</td><td><strong>\u2212$800</strong></td></tr></tbody></table>"},{"id":"14","title":"The naked call seller","html":"<table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>Maximum gain</td><td><strong>$200.</strong> The premium.</td></tr><tr><td>Maximum loss</td><td><strong>No fixed ceiling</strong></td></tr><tr><td>Break-even</td><td><strong>$52</strong></td></tr><tr><td>Wins when</td><td>Nothing much happens</td></tr></tbody></table>"},{"id":"15","title":"Why this course doesn't teach naked calls","html":"<p>There is no ceiling on the loss.</p><p>NORTH at $80 costs the seller $2,800. At $120, $6,800.</p><blockquote>We cover it so you understand who&#x27;s on the other side of your trade. Not so you place it.</blockquote>"},{"id":"16","title":"Covered calls","html":"<p>Own the shares first. Then sell the call.</p><ul><li>Own 100 NORTH at <strong>$50</strong> \u2014 $5,000</li><li>Sell the <strong>55 call</strong> for <strong>$1.20</strong> \u2014 receive $120</li></ul><p>Now the obligation is backed by shares you already hold.</p>"},{"id":"17","title":"Covered call: every outcome","html":"<p>Own 100 at $50. Sold the 55 call for $120.</p><table><thead><tr><th>NORTH</th><th>Shares</th><th>Premium</th><th>Position P/L</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td>\u2212$500</td><td>+$120</td><td><strong>\u2212$380</strong></td></tr><tr><td>$48.80</td><td>\u2212$120</td><td>+$120</td><td><strong>$0</strong></td></tr><tr><td>$50</td><td>$0</td><td>+$120</td><td><strong>+$120</strong></td></tr><tr><td>$55</td><td>+$500</td><td>+$120</td><td><strong>+$620</strong></td></tr><tr><td>$60</td><td>+$500</td><td>+$120</td><td><strong>+$620</strong></td></tr><tr><td>$70</td><td>+$500</td><td>+$120</td><td><strong>+$620</strong></td></tr></tbody></table>"},{"id":"18","title":"Break-even and ceiling","html":"<p><strong>Break-even:</strong> $50 \u2212 $1.20 = <strong>$48.80</strong></p><p><strong>Maximum profit:</strong> <strong>$620</strong>, at $55 or anywhere above</p><p>The premium lowered your break-even by $1.20.</p><p>The strike capped your upside at $55.</p>"},{"id":"19","title":"What you gave up","html":"<table><thead><tr><th>NORTH</th><th>Covered call</th><th>Shares alone</th><th>Given up</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td>\u2212$380</td><td>\u2212$500</td><td><em>gained $120</em></td></tr><tr><td>$50</td><td>+$120</td><td>$0</td><td><em>gained $120</em></td></tr><tr><td>$55</td><td>+$620</td><td>+$500</td><td><em>gained $120</em></td></tr><tr><td>$60</td><td>+$620</td><td>+$1,000</td><td><strong>$380</strong></td></tr><tr><td>$70</td><td>+$620</td><td>+$2,000</td><td><strong>$1,380</strong></td></tr></tbody></table><blockquote>You are selling your upside. The premium is the price.</blockquote>"},{"id":"20","title":"Assignment","html":"<p>Above the strike at expiration, expect to be assigned.</p><p><strong>What happens:</strong> your 100 shares are sold at $55. Automatically.</p><ul><li>You keep the premium</li><li>You keep the gain up to $55</li><li>You no longer own the shares</li><li>There may be a fee</li></ul>"},{"id":"21","title":"Common mistakes","html":"<ul><li>Treating the premium as profit before expiration</li><li>Forgetting the multiplier</li><li>Ignoring break-even, and celebrating a rise that isn&#x27;t enough</li><li>Selling covered calls on shares you don&#x27;t want to lose</li><li>Choosing a strike by premium size alone</li><li>Forgetting an earnings date inside the contract&#x27;s life</li></ul>"},{"id":"22","title":"Today, and what's next","html":"<p><strong>Today:</strong></p><ul><li>A call is a right to buy. The seller owes the delivery.</li><li>Buyer: loss capped at premium, gain uncapped, break-even is strike plus premium</li><li>Naked seller: gain capped at premium, loss uncapped</li><li>Covered call: premium lowers break-even, strike caps upside</li><li>Being assigned is the strategy working, not failing</li></ul><p><strong>Next: Day 5.</strong> Put options. Same structure, mirrored.</p>"}], AU = {"1":"https://wealthorbit.ca/audio/day-04/day-04_slide-1.mp3","10":"https://wealthorbit.ca/audio/day-04/day-04_slide-10.mp3","11":"https://wealthorbit.ca/audio/day-04/day-04_slide-11.mp3","12":"https://wealthorbit.ca/audio/day-04/day-04_slide-12.mp3","13":"https://wealthorbit.ca/audio/day-04/day-04_slide-13.mp3","14":"https://wealthorbit.ca/audio/day-04/day-04_slide-14.mp3","15":"https://wealthorbit.ca/audio/day-04/day-04_slide-15.mp3","16":"https://wealthorbit.ca/audio/day-04/day-04_slide-16.mp3","17":"https://wealthorbit.ca/audio/day-04/day-04_slide-17.mp3","18":"https://wealthorbit.ca/audio/day-04/day-04_slide-18.mp3","19":"https://wealthorbit.ca/audio/day-04/day-04_slide-19.mp3","2":"https://wealthorbit.ca/audio/day-04/day-04_slide-2.mp3","20":"https://wealthorbit.ca/audio/day-04/day-04_slide-20.mp3","21":"https://wealthorbit.ca/audio/day-04/day-04_slide-21.mp3","22":"https://wealthorbit.ca/audio/day-04/day-04_slide-22.mp3","3":"https://wealthorbit.ca/audio/day-04/day-04_slide-3.mp3","4":"https://wealthorbit.ca/audio/day-04/day-04_slide-4.mp3","5":"https://wealthorbit.ca/audio/day-04/day-04_slide-5.mp3","6":"https://wealthorbit.ca/audio/day-04/day-04_slide-6.mp3","7":"https://wealthorbit.ca/audio/day-04/day-04_slide-7.mp3","8":"https://wealthorbit.ca/audio/day-04/day-04_slide-8.mp3","9":"https://wealthorbit.ca/audio/day-04/day-04_slide-9.mp3"}, KEY = 'wo-day-04';
let i = 0;
const $ = x => document.getElementById(x);

function paint(){
  const s = SL[i];
  $('slide').innerHTML = `<p class="sn">SLIDE ${s.id} / ${SL.length}</p>` +
                         (s.title ? `<h2>${s.title}</h2>` : '') + s.html;
  const src = AU[s.id];
  const au = $('au');
  au.pause();
  if(src){ au.src = src; $('play').disabled = false; }
  else   { au.removeAttribute('src'); $('play').disabled = true; }
  setIcon(false);
  $('fill').style.width = '0%';
  $('time').textContent = '0:00';
  $('prev').disabled = i===0;
  $('next').disabled = i===SL.length-1;
  $('pg').style.width = ((i+1)/SL.length*100)+'%';
  document.querySelectorAll('.dot').forEach((d,n)=>{
    d.className = 'dot' + (n===i?' on':(n<i?' done':''));
  });
  try{ localStorage.setItem(KEY, i); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(n){ if(n>=0 && n<SL.length){ i=n; paint(); } }

SL.forEach((s,n)=>{
  const b=document.createElement('button');
  b.className='dot'; b.textContent=s.id; b.title='Slide '+s.id;
  b.onclick=()=>go(n); $('rail').appendChild(b);
});

$('prev').onclick = ()=>go(i-1);
$('next').onclick = ()=>go(i+1);

const au = $('au');
function setIcon(playing){
  document.querySelector('.i-play').style.display  = playing ? 'none' : '';
  document.querySelector('.i-pause').style.display = playing ? '' : 'none';
  $('play').setAttribute('aria-label', playing ? 'Pause narration' : 'Play narration');
}
function mmss(t){
  if(!isFinite(t)) return '0:00';
  const m = Math.floor(t/60), s2 = Math.floor(t%60);
  return m + ':' + String(s2).padStart(2,'0');
}
$('play').onclick = ()=>{ au.paused ? au.play().catch(()=>{}) : au.pause(); };
au.addEventListener('play',  ()=>setIcon(true));
au.addEventListener('pause', ()=>setIcon(false));
au.addEventListener('timeupdate', ()=>{
  if(au.duration){
    $('fill').style.width = (au.currentTime/au.duration*100)+'%';
    $('time').textContent = mmss(au.duration - au.currentTime);
  }
});
au.addEventListener('loadedmetadata', ()=>{ $('time').textContent = mmss(au.duration); });
$('track').addEventListener('click', e=>{
  if(!au.duration) return;
  const r = $('track').getBoundingClientRect();
  au.currentTime = (e.clientX - r.left) / r.width * au.duration;
});
au.addEventListener('ended', ()=>{
  setIcon(false);
  if($('ap').checked && i<SL.length-1){ go(i+1); setTimeout(()=>au.play().catch(()=>{}),350); }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(i+1);
  if(e.key==='ArrowLeft')  go(i-1);
  if(e.key===' '){ e.preventDefault(); au.paused ? au.play().catch(()=>{}) : au.pause(); }
});
try{ const v=parseInt(localStorage.getItem(KEY)); if(v>0 && v<SL.length) i=v; }catch(e){}
paint();
</script>
</body>
</html>
