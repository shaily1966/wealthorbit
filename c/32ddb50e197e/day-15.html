<script>
const SL = [{"id":"1","title":"Risk and position management","html":"<p>Day 15 of 17</p><p>The session that decides whether you are still doing this in five years.</p>"},{"id":"2","title":"Everything so far was about one trade","html":"<p>Today is about the <strong>account.</strong></p><p class='shout'>A trader who is right more often than not can still be wiped out by being wrong at the wrong size.</p>"},{"id":"3","title":"Why losses are asymmetric","html":"<table><thead><tr><th>Lose</th><th>Need to get back</th></tr></thead><tbody><tr><td></td></tr><tr><td>10%</td><td>+11.1%</td></tr><tr><td>20%</td><td>+25.0%</td></tr><tr><td>30%</td><td>+42.9%</td></tr><tr><td>50%</td><td><strong>+100%</strong></td></tr><tr><td>75%</td><td><strong>+300%</strong></td></tr><tr><td>90%</td><td><strong>+900%</strong></td></tr></tbody></table>"},{"id":"4","title":"Read that again","html":"<p>A 50% loss requires a <strong>100% gain</strong> to recover.</p><p>Not 50%. One hundred.</p><blockquote>Protecting the account is not caution. It is arithmetic.</blockquote>"},{"id":"5","title":"The sizing rule","html":"<p>Risk a <strong>fixed percentage</strong> of the account on each trade.</p><table><thead><tr><th>Account</th><th>1%</th><th>2%</th></tr></thead><tbody><tr><td></td></tr><tr><td>$25,000</td><td>$250</td><td>$500</td></tr></tbody></table><p>Not a fixed number of contracts. Not what feels right.</p>"},{"id":"6","title":"Sizing a defined-risk trade","html":"<p>Bull call spread 50/55. Maximum loss <strong>$165</strong> per contract.</p><p>$25,000 account, 2% risk = <strong>$500</strong></p><p>$500 \u00f7 $165 = <strong>3 contracts</strong></p><p class='shout'>That is the whole calculation.</p>"},{"id":"7","title":"Now try it on a cash-secured put","html":"<p>47.50 strike. Theoretical maximum loss <strong>$4,635.</strong></p><p>$500 \u00f7 $4,635 = <strong>0.11 contracts</strong></p><p class='shout'>You cannot place this trade.</p>"},{"id":"8","title":"That is not a mistake","html":"<p>A $25,000 account genuinely <strong>cannot</strong> hold a cash-secured put at a 2% risk budget.</p><p>The strategy sold as conservative income requires a far larger account than most people running it have.</p>"},{"id":"9","title":"So how is it ever sized?","html":"<p>You size off a <strong>realistic adverse move</strong>, not the theoretical maximum.</p><p>Effective cost if assigned: <strong>$46.35</strong></p><table><thead><tr><th>NORTH falls</th><th>To</th><th>Loss per contract</th><th>Contracts at $500</th></tr></thead><tbody><tr><td></td></tr><tr><td>10%</td><td>$45.00</td><td>$135</td><td>3.7</td></tr><tr><td>15%</td><td>$42.50</td><td>$385</td><td>1.3</td></tr><tr><td>20%</td><td>$40.00</td><td>$635</td><td>0.8</td></tr><tr><td>30%</td><td>$35.00</td><td>$1,135</td><td>0.4</td></tr></tbody></table>"},{"id":"10","title":"The honest problem with that","html":"<p class='shout'>You chose the scenario.</p><p>A 10% fall gives you 3 contracts. A 20% fall gives you less than one.</p><blockquote>The number you pick is a judgement, and it is the judgement the whole position rests on.</blockquote>"},{"id":"11","title":"Which is why defined risk matters","html":"<p><strong>Defined risk:</strong> maximum loss is a fact. Sizing is arithmetic.</p><p><strong>Undefined risk:</strong> maximum loss is absurd. Sizing is a judgement you may get wrong.</p><blockquote>Day 11&#x27;s argument, arriving.</blockquote>"},{"id":"12","title":"Portfolio heat","html":"<p>Per-trade risk is not enough. Cap the <strong>total.</strong></p><p>Rule: total risk across all open positions \u2264 <strong>6%</strong></p><table><thead><tr><th>Per trade</th><th>Maximum positions</th></tr></thead><tbody><tr><td></td></tr><tr><td>2%</td><td><strong>3</strong></td></tr><tr><td>1%</td><td><strong>6</strong></td></tr></tbody></table>"},{"id":"13","title":"Correlation destroys this","html":"<p>Six bull put spreads. Each risks $360. Each on a different technology stock.</p><p>You believe you hold <strong>six</strong> positions.</p><p class='shout'>In a market-wide fall you hold one, risking $2,160.</p>"},{"id":"14","title":"Correlation is not obvious","html":"<p>Positions correlate through:</p><ul><li><strong>Sector</strong> \u2014 the same industry</li><li><strong>Factor</strong> \u2014 growth, rates, commodities</li><li><strong>Direction</strong> \u2014 six bullish positions are one bullish bet</li><li><strong>Structure</strong> \u2014 six short-premium positions all lose in a volatility spike</li></ul>"},{"id":"15","title":"The rule that follows","html":"<p>Count correlated positions as <strong>one</strong> position for heat purposes.</p><p>Six bullish tech spreads at 2% each is not 12% of heat spread across six trades.</p><p class='shout'>It is one 12% position.</p>"},{"id":"16","title":"Managing winners","html":"<p>Credit spread. Collected <strong>$145.</strong> Maximum profit <strong>$145.</strong> Still risking <strong>$355.</strong></p><table><thead><tr><th>Close at</th><th>You keep</th><th>Left on table</th><th>Still risking</th></tr></thead><tbody><tr><td></td></tr><tr><td>25%</td><td>$36</td><td>$109</td><td>$355</td></tr><tr><td>50%</td><td>$72</td><td>$72</td><td>$355</td></tr><tr><td>75%</td><td>$109</td><td>$36</td><td><strong>$355</strong></td></tr><tr><td>90%</td><td>$130</td><td>$14</td><td><strong>$355</strong></td></tr></tbody></table>"},{"id":"17","title":"Read the last column","html":"<p>The risk <strong>never falls.</strong></p><p>At 75% of maximum profit you are risking <strong>$355</strong> to capture the last <strong>$36.</strong></p><blockquote>That is a poor remaining bet, regardless of how the trade has gone so far.</blockquote>"},{"id":"18","title":"Managing losers","html":"<p>Decide the exit <strong>before</strong> you enter.</p><ul><li>A defined-risk position can be held to its maximum \u2014 you sized for it</li><li>A position that has invalidated your thesis should be closed, whatever the price</li><li>&quot;It might come back&quot; is not a plan</li></ul>"},{"id":"19","title":"Rolling: management or denial?","html":"<p>Short 47.50 put. NORTH falls to $44. The put is now worth <strong>$4.10.</strong></p><p>Loss if closed: <strong>$295</strong></p><p>Roll down and out to the 45 strike, 60 days, collecting <strong>$3.20</strong>:</p><p class='shout'>Net debit $90. You paid to extend.</p>"},{"id":"20","title":"The test for a roll","html":"<p><strong>Management:</strong> the roll brings in a net credit, and your view is unchanged.</p><p><strong>Denial:</strong> the roll costs you money, and its purpose is to avoid recording the loss.</p><blockquote>A loss you have not closed is still a loss.</blockquote>"},{"id":"21","title":"Exercise and assignment","html":"<p>Two words for the two sides of one event.</p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td><strong>Exercise</strong></td><td>The <strong>buyer</strong> acts on their right</td></tr><tr><td><strong>Assignment</strong></td><td>The <strong>seller</strong> is required to deliver</td></tr></tbody></table><blockquote>You never choose to be assigned. Someone else exercised.</blockquote>"},{"id":"21A","title":"When it happens","html":"<p><strong>At expiration.</strong> Anything in the money by $0.01 is exercised automatically. You do not have to be notified in advance.</p><p><strong>Before expiration.</strong> Only the <strong>buyer</strong> can choose this, and they only choose it when holding the option is worth less than acting on it.</p><table><thead><tr><th>Short position</th><th>Early assignment risk</th></tr></thead><tbody><tr><td></td></tr><tr><td>Short call, ex-dividend approaching</td><td><strong>Highest</strong></td></tr><tr><td>Short put, deep in the money</td><td>Moderate</td></tr><tr><td>Anything out of the money</td><td>Effectively nil</td></tr></tbody></table>"},{"id":"21B","title":"What actually happens to you","html":"<p><strong>Short call assigned</strong> \u2014 you deliver 100 shares at the strike. If you owned them, they are gone. If you did not, you are now short 100 shares.</p><p><strong>Short put assigned</strong> \u2014 you buy 100 shares at the strike. Cash leaves. You now own stock.</p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>The premium</td><td><strong>Yours.</strong> Always was.</td></tr><tr><td>Notification</td><td>Usually <strong>overnight</strong>, after the fact</td></tr><tr><td>Choice</td><td><strong>None</strong></td></tr><tr><td>A fee</td><td>Often</td></tr></tbody></table>"},{"id":"21C","title":"Assignment inside a spread","html":"<p>Your short leg is assigned. Your long leg is <strong>still there.</strong></p><ul><li>Maximum loss is <strong>unchanged</strong> \u2014 the long leg still caps it</li><li>But you now hold shares, using capital you had not planned to use</li><li>And you have a position to unwind rather than a tidy structure</li></ul><blockquote>Not a breach of your risk. A mess to tidy.</blockquote>"},{"id":"21D","title":"What it changes about management","html":"<ul><li><strong>Check ex-dividend dates</strong> on every short call. Published in advance.</li><li>Deep in-the-money short options are <strong>more likely</strong> to be assigned</li><li>Assignment uses buying power \u2014 check <strong>excess liquidity</strong> afterwards</li><li>Being assigned on a covered call or cash-secured put is <strong>the strategy working</strong></li></ul><blockquote>Plan for it. Do not be surprised by it.</blockquote>"},{"id":"21E","title":"The wheel","html":"<p>The most widely run retail options strategy. It is <strong>assignment, on purpose, repeatedly.</strong></p><ol><li>Sell a <strong>cash-secured put</strong> on a stock you want to own</li><li>Not assigned? Keep the premium. Repeat step 1.</li><li>Assigned? You now own 100 shares</li><li>Sell a <strong>covered call</strong> against them</li><li>Not assigned? Keep the premium. Repeat step 4.</li><li>Assigned? Shares sold. Return to step 1.</li></ol>"},{"id":"21F","title":"What the wheel does and does not do","html":"<p><strong>Does:</strong> collect premium at every stage \u00b7 lower your effective cost basis \u00b7 give assignment a purpose</p><p><strong>Does not:</strong></p><p class='shout'>Remove downside risk.</p><p>Between step 3 and step 6 you own 100 shares outright. If the stock falls 40%, you own a stock that has fallen 40%.</p><p>The premium collected is a cushion, not a hedge.</p>"},{"id":"21G","title":"The wheel, honestly","html":"<p>NORTH at $50. Sell the 47.50 put for $1.15. Assigned at $47.50 \u2014 effective cost <strong>$46.35.</strong></p><p>NORTH is now at <strong>$38.</strong></p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>You own</td><td>100 shares, cost basis $46.35</td></tr><tr><td>Unrealised loss</td><td><strong>\u2212$835</strong></td></tr><tr><td>Covered call you can now sell at $47.50</td><td>Worth almost nothing</td></tr><tr><td>Covered call that pays meaningfully</td><td>Strike near $38, locking in the loss</td></tr></tbody></table><blockquote>The wheel does not fail loudly. It traps you in a stock at a strike you no longer want.</blockquote>"},{"id":"22","title":"Expiration week","html":"<p>Gamma is at its most severe \u2014 Day 9.</p><p>Positions swing violently on small moves. There is no time to recover.</p><blockquote>Most positions should be closed or resolved before this week, deliberately.</blockquote>"},{"id":"23","title":"When not to trade","html":"<ul><li>You cannot set all four dials</li><li>Portfolio heat is already at its cap</li><li>You are trying to recover a loss</li><li>You are trading because nothing else is happening</li><li>The liquidity gate failed</li></ul>"},{"id":"24","title":"The one about revenge","html":"<p>Trading to recover a loss is the most reliable way to turn a small loss into a serious one.</p><p>The account does not know what it used to be worth.</p><p class='shout'>Size off what you have, not what you had.</p>"},{"id":"25","title":"Common mistakes","html":"<ul><li>Sizing by contract count rather than by risk</li><li>Sizing an undefined-risk position off the theoretical maximum, or off nothing</li><li>Counting correlated positions separately</li><li>Holding a winner for the last few percent</li><li>Rolling at a debit to avoid recording a loss</li><li>Increasing size after a loss</li></ul>"},{"id":"26","title":"Today, and what's next","html":"<p><strong>Today:</strong></p><ul><li>A 50% loss needs a 100% gain. Protecting capital is arithmetic.</li><li>Size off maximum loss when it is a fact; off a chosen adverse move when it is not</li><li>A $25,000 account cannot hold a cash-secured put at 2% risk</li><li>Correlated positions are one position</li><li>The risk on a credit spread never falls as profit accrues</li><li>A roll at a debit is not management</li></ul><p><strong>Next: Day 16.</strong> Building the process that ties all of this together.</p>"}], AU = {"1":"https://wealthorbit.ca/audio/day-15/day-15_slide-1.mp3","10":"https://wealthorbit.ca/audio/day-15/day-15_slide-10.mp3","11":"https://wealthorbit.ca/audio/day-15/day-15_slide-11.mp3","12":"https://wealthorbit.ca/audio/day-15/day-15_slide-12.mp3","13":"https://wealthorbit.ca/audio/day-15/day-15_slide-13.mp3","14":"https://wealthorbit.ca/audio/day-15/day-15_slide-14.mp3","15":"https://wealthorbit.ca/audio/day-15/day-15_slide-15.mp3","16":"https://wealthorbit.ca/audio/day-15/day-15_slide-16.mp3","17":"https://wealthorbit.ca/audio/day-15/day-15_slide-17.mp3","18":"https://wealthorbit.ca/audio/day-15/day-15_slide-18.mp3","19":"https://wealthorbit.ca/audio/day-15/day-15_slide-19.mp3","2":"https://wealthorbit.ca/audio/day-15/day-15_slide-2.mp3","20":"https://wealthorbit.ca/audio/day-15/day-15_slide-20.mp3","21":"https://wealthorbit.ca/audio/day-15/day-15_slide-21.mp3","21A":"https://wealthorbit.ca/audio/day-15/day-15_slide-21A.mp3","21B":"https://wealthorbit.ca/audio/day-15/day-15_slide-21B.mp3","21C":"https://wealthorbit.ca/audio/day-15/day-15_slide-21C.mp3","21D":"https://wealthorbit.ca/audio/day-15/day-15_slide-21D.mp3","21E":"https://wealthorbit.ca/audio/day-15/day-15_slide-21E.mp3","21F":"https://wealthorbit.ca/audio/day-15/day-15_slide-21F.mp3","21G":"https://wealthorbit.ca/audio/day-15/day-15_slide-21G.mp3","22":"https://wealthorbit.ca/audio/day-15/day-15_slide-22.mp3","23":"https://wealthorbit.ca/audio/day-15/day-15_slide-23.mp3","24":"https://wealthorbit.ca/audio/day-15/day-15_slide-24.mp3","25":"https://wealthorbit.ca/audio/day-15/day-15_slide-25.mp3","26":"https://wealthorbit.ca/audio/day-15/day-15_slide-26.mp3","3":"https://wealthorbit.ca/audio/day-15/day-15_slide-3.mp3","4":"https://wealthorbit.ca/audio/day-15/day-15_slide-4.mp3","5":"https://wealthorbit.ca/audio/day-15/day-15_slide-5.mp3","6":"https://wealthorbit.ca/audio/day-15/day-15_slide-6.mp3","7":"https://wealthorbit.ca/audio/day-15/day-15_slide-7.mp3","8":"https://wealthorbit.ca/audio/day-15/day-15_slide-8.mp3","9":"https://wealthorbit.ca/audio/day-15/day-15_slide-9.mp3"}, KEY = 'wo-day-15';
let i = 0;
const $ = x => document.getElementById(x);

function paint(){
  const s = SL[i];
  $('slide').innerHTML = `<p class="sn">SLIDE ${s.id} / ${SL.length}</p>` +
                         (s.title ? `<h2>${s.title}</h2>` : '') + s.html;
  const src = AU[s.id];
  const au = $('au');

  if(src){ au.src = src; $('play').disabled = false; }
  else   { au.removeAttribute('src'); $('play').disabled = true; }
  setIcon(false);

  $('pg').style.width = ((i+1)/SL.length*100)+'%';

    d.className = 'dot' + (n===i?' on':(n<i?' done':''));

  window.scrollTo({top:0,behavior:'smooth'});

function go(n){ if(n>=0 && n<SL.length){ i=n; paint(); } }

SL.forEach((s,n)=>{
  const b=document.createElement('button');
  b.className='dot'; b.textContent=s.id; b.title='Slide '+s.id;
  b.onclick=()=>go(n); $('rail').appendChild(b);
});

$('prev').onclick = ()=>go(i-1);
$('next').onclick = ()=>go(i+1);

const au = $('au');
function setIcon(playing){
  document.querySelector('.i-play').style.display  = playing ? 'none' : '';
  document.querySelector('.i-pause').style.display = playing ? '' : 'none';
  $('play').setAttribute('aria-label', playing ? 'Pause narration' : 'Play narration');
}
function mmss(t){
  if(!isFinite(t)) return '0:00';
  const m = Math.floor(t/60), s2 = Math.floor(t%60);
  return m + ':' + String(s2).padStart(2,'0');
}
$('play').onclick = ()=>{ au.paused ? au.play().catch(()=>{}) : au.pause(); };
au.addEventListener('play',  ()=>setIcon(true));
au.addEventListener('pause', ()=>setIcon(false));
au.addEventListener('timeupdate', ()=>{
  if(au.duration){
    $('fill').style.width = (au.currentTime/au.duration*100)+'%';
    $('time').textContent = mmss(au.duration - au.currentTime);
  }
});
au.addEventListener('loadedmetadata', ()=>{ $('time').textContent = mmss(au.duration); });
$('track').addEventListener('click', e=>{
  if(!au.duration) return;
  const r = $('track').getBoundingClientRect();
  au.currentTime = (e.clientX - r.left) / r.width * au.duration;
});
au.addEventListener('ended', ()=>{
  setIcon(false);
  if($('ap').checked && i<SL.length-1){ go(i+1); setTimeout(()=>au.play().catch(()=>{}),350); }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(i+1);
  if(e.key==='ArrowLeft')  go(i-1);
  if(e.key===' '){ e.preventDefault(); au.paused ? au.play().catch(()=>{}) : au.pause(); }
});
try{ const v=parseInt(localStorage.getItem(KEY)); if(v>0 && v<SL.length) i=v; }catch(e){}
paint();
</script>
</body>
