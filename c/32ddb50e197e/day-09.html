<style>
:root{
  --paper:#0B0D11;
  --card:#14181E; --card2:#1B2028; --card-2:#1B2028;

  --ink:#EAEDF1;

  --up:#3FD68A; --down:#FF6B6B;

}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);
 -webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.94);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topin{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;
 align-items:center;justify-content:space-between;gap:16px}
.back{color:var(--ink3);text-decoration:none;font:500 12px/1 var(--mono);letter-spacing:.08em}
.back:hover{color:var(--ink)}
.sess{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);text-align:right}
.sess b{color:var(--ink);font-weight:600}
.prog{height:2px;background:var(--rule2)}
.prog i{display:block;height:100%;background:var(--live);width:0;transition:width .3s}

.stage{max-width:1080px;margin:0 auto;padding:36px 24px 0}
.slide{background:var(--card);border:1px solid var(--rule);border-radius:10px;
 padding:52px 56px;min-height:440px;display:flex;flex-direction:column;justify-content:center}
.sn{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);margin:0 0 20px}
.slide h2{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:0 0 26px;font-weight:600}
.slide p{margin:0 0 15px;font-size:17px;color:var(--ink2)}
.slide p:last-child{margin-bottom:0}
.slide .shout{font-size:29px;line-height:1.28;font-weight:600;color:var(--ink);
 margin:22px 0;letter-spacing:-.01em}
.slide ul,.slide ol{margin:0 0 16px;padding-left:22px}
.slide li{margin-bottom:11px;font-size:17px;color:var(--ink2)}
.slide li::marker{color:var(--ink3)}
.slide ul li .box{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink3);
 border-radius:3px;margin-right:11px;vertical-align:-1px}
.slide blockquote{margin:22px 0;padding:2px 0 2px 20px;border-left:2px solid var(--live);
 color:var(--ink);font-size:17px}
.slide strong{color:var(--ink);font-weight:600}
.slide code{font-family:var(--mono);font-size:15px;background:var(--rule2);
 padding:2px 6px;border-radius:3px;color:var(--ink)}
.slide table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15.5px}
.slide th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
 color:var(--ink3);padding:0 16px 11px 0;border-bottom:1px solid var(--rule)}
.slide td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.slide tr:last-child td{border-bottom:none}
.slide td strong{color:var(--ink)}

.bar{max-width:1080px;margin:0 auto;padding:20px 24px 8px;display:flex;align-items:center;gap:16px}
audio{display:none}
.play{width:54px;height:54px;flex:none;border-radius:50%;border:none;cursor:pointer;
 background:var(--live);color:#04101f;display:grid;place-items:center;padding:0;
 box-shadow:0 4px 18px rgba(91,157,255,.32);transition:transform .12s,box-shadow .12s}
.play:hover{transform:scale(1.06);box-shadow:0 6px 24px rgba(91,157,255,.45)}
.play:active{transform:scale(.97)}
.play svg{fill:#04101f;pointer-events:none}
.play:disabled{background:var(--rule);box-shadow:none;cursor:default;transform:none}
.play:disabled svg{fill:var(--ink3)}
.track{flex:1;height:6px;background:var(--rule);border-radius:3px;cursor:pointer;position:relative}
.track .fill{height:100%;width:0;background:var(--live);border-radius:3px;transition:width .1s linear}
.time{font:500 13px/1 var(--mono);color:var(--ink3);min-width:42px;text-align:right;
 font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px}
button{background:var(--card);border:1px solid var(--rule);color:var(--ink);
 font:500 15px/1 var(--body);padding:14px 16px;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){background:var(--card2);border-color:var(--ink3)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);
 white-space:nowrap;cursor:pointer;user-select:none}
.auto input{accent-color:var(--live);width:15px;height:15px}

.rail{max-width:1080px;margin:0 auto;padding:14px 24px 60px;display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--rule);background:var(--card);
 color:var(--ink3);font:500 10px/1 var(--mono);cursor:pointer;display:grid;place-items:center}
.dot:hover{border-color:var(--ink3);color:var(--ink)}
.dot.on{background:var(--live);border-color:var(--live);color:#06101f;font-weight:600}
.dot.done{color:var(--ink2);border-color:var(--rule)}
@media(max-width:720px){.slide{padding:32px 24px;min-height:340px}
 .slide h2{font-size:24px}.slide .shout{font-size:22px}.stage{padding:20px 16px 0}
 .bar{flex-wrap:wrap;padding:16px}.rail{padding:12px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const SL = [{"id":"1","title":"The Greeks","html":"<p>Day 9 of 17</p><p>Putting a number on everything so far.</p>"},{"id":"2","title":"What the Greeks are for","html":"<p>So far: <em>&quot;an option loses value as time passes.&quot;</em></p><p>After today: <em>&quot;this option loses 3.4 cents tomorrow.&quot;</em></p><p class='shout'>The Greeks turn descriptions into measurements.</p>"},{"id":"3","title":"Five letters, five questions","html":"<table><thead><tr><th>Greek</th><th>Answers</th></tr></thead><tbody><tr><td></td></tr><tr><td><strong>Delta</strong></td><td>If the stock moves $1, how much does my option move?</td></tr><tr><td><strong>Gamma</strong></td><td>How fast does delta itself change?</td></tr><tr><td><strong>Theta</strong></td><td>What does one day cost me?</td></tr><tr><td><strong>Vega</strong></td><td>What does a 1-point volatility change do?</td></tr><tr><td><strong>Rho</strong></td><td>What do interest rates do?</td></tr></tbody></table>"},{"id":"4","title":"Delta","html":"<p><strong>How much the option price moves for a $1 move in the stock.</strong></p><ul><li>Calls: <strong>0 to 1</strong></li><li>Puts: <strong>\u22121 to 0</strong></li></ul><p>A delta of 0.50 means the option gains about 50\u00a2 when the stock gains $1.</p>"},{"id":"5","title":"Delta across our chain","html":"<p>NORTH at $50, 30 days.</p><table><thead><tr><th>Strike</th><th>Call delta</th><th>Put delta</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td>0.86</td><td>\u22120.14</td></tr><tr><td>$47.50</td><td>0.71</td><td>\u22120.29</td></tr><tr><td><strong>$50</strong></td><td><strong>0.52</strong></td><td><strong>\u22120.48</strong></td></tr><tr><td>$52.50</td><td>0.34</td><td>\u22120.66</td></tr><tr><td>$55</td><td>0.19</td><td>\u22120.81</td></tr><tr><td>$60</td><td>0.04</td><td>\u22120.96</td></tr></tbody></table>"},{"id":"6","title":"Three things to notice","html":"<ol><li>Deep in the money \u2192 delta near <strong>1</strong>. It tracks the stock almost exactly.</li><li>At the money \u2192 delta near <strong>0.5</strong>.</li><li>Far out of the money \u2192 delta near <strong>0</strong>. The stock barely matters.</li></ol><blockquote>Call delta minus 1 gives you the put delta at the same strike. Every time.</blockquote>"},{"id":"7","title":"Delta as exposure","html":"<p>A delta of 0.52 means one contract behaves like <strong>52 shares</strong> of NORTH.</p><table><thead><tr><th>Position</th><th>Behaves like</th></tr></thead><tbody><tr><td></td></tr><tr><td>1 call, delta 0.52</td><td>Long 52 shares</td></tr><tr><td>5 calls, delta 0.52</td><td>Long 260 shares</td></tr><tr><td>1 put, delta \u22120.48</td><td>Short 48 shares</td></tr></tbody></table>"},{"id":"8","title":"Delta as rough probability","html":"<p>Delta approximates the chance of finishing <strong>in the money.</strong></p><p>Delta 0.19 \u2192 roughly a 19% chance.</p><blockquote>It is an approximation, not a forecast. It shifts constantly and it says nothing about how far past the strike you finish.</blockquote>"},{"id":"9","title":"Delta doesn't stay still","html":"<p>NORTH $50 call, delta 0.52.</p><table><thead><tr><th>Stock</th><th>Delta</th></tr></thead><tbody><tr><td></td></tr><tr><td>$48</td><td>0.37</td></tr><tr><td>$49</td><td>0.44</td></tr><tr><td><strong>$50</strong></td><td><strong>0.52</strong></td></tr><tr><td>$51</td><td>0.60</td></tr><tr><td>$52</td><td>0.67</td></tr></tbody></table>"},{"id":"10","title":"Gamma","html":"<p><strong>The rate at which delta itself changes.</strong></p><p>Delta tells you your exposure now.</p><p>Gamma tells you how fast that exposure is shifting.</p>"},{"id":"11","title":"Gamma across the chain","html":"<table><thead><tr><th>Strike</th><th>Gamma</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td>0.043</td></tr><tr><td>$47.50</td><td>0.067</td></tr><tr><td><strong>$50</strong></td><td><strong>0.077</strong></td></tr><tr><td>$52.50</td><td>0.071</td></tr><tr><td>$55</td><td>0.053</td></tr><tr><td>$60</td><td>0.018</td></tr></tbody></table><p>Peaks at the money. Same shape as extrinsic value.</p>"},{"id":"12","title":"Why delta undershoots","html":"<p>Delta says the $50 call gains <strong>52\u00a2</strong> when NORTH rises $1.</p><p>It actually gains <strong>56\u00a2.</strong></p><p>Because delta rose <em>during</em> the move. That is gamma.</p>"},{"id":"13","title":"Gamma explodes near expiration","html":"<p>NORTH $50 call, at the money.</p><table><thead><tr><th>Days left</th><th>Gamma</th></tr></thead><tbody><tr><td></td></tr><tr><td>30</td><td>0.077</td></tr><tr><td>14</td><td>0.113</td></tr><tr><td>7</td><td>0.160</td></tr><tr><td>1</td><td><strong>0.423</strong></td></tr></tbody></table>"},{"id":"14","title":"Theta","html":"<p><strong>What one day costs.</strong></p><table><thead><tr><th>Days left</th><th>Theta</th></tr></thead><tbody><tr><td></td></tr><tr><td>30</td><td>\u2212$0.034</td></tr><tr><td>14</td><td>\u2212$0.050</td></tr><tr><td>7</td><td>\u2212$0.071</td></tr><tr><td>1</td><td>\u2212$0.188</td></tr></tbody></table><p>The Day 8 decay curve, with a number on it.</p>"},{"id":"15","title":"Look at those two slides together","html":"<table><thead><tr><th>Days</th><th>Gamma</th><th>Theta</th></tr></thead><tbody><tr><td></td></tr><tr><td>30</td><td>0.077</td><td>\u2212$0.034</td></tr><tr><td>14</td><td>0.113</td><td>\u2212$0.050</td></tr><tr><td>7</td><td>0.160</td><td>\u2212$0.071</td></tr><tr><td>1</td><td>0.423</td><td>\u2212$0.188</td></tr></tbody></table><p class='shout'>They rise together. Identically.</p>"},{"id":"16","title":"The single most useful idea in this session","html":"<p>Gamma is the <strong>reward</strong> for holding a short-dated option.</p><p>Theta is the <strong>rent</strong> you pay for it.</p><p>They are the same curve.</p><blockquote>There is no expiration where one is cheap and the other is generous. You cannot have one without the other.</blockquote>"},{"id":"17","title":"Which side are you on?","html":"<table><thead><tr><th></th><th>Long option</th><th>Short option</th></tr></thead><tbody><tr><td></td></tr><tr><td>Gamma</td><td>Positive \u2014 moves help</td><td>Negative \u2014 moves hurt</td></tr><tr><td>Theta</td><td>Negative \u2014 pay rent</td><td>Positive \u2014 collect rent</td></tr></tbody></table>"},{"id":"18","title":"Vega","html":"<p><strong>How much the price moves for a 1-point change in implied volatility.</strong></p><p>The $50 call: vega <strong>0.057.</strong></p><p>Volatility 36% \u2192 37%: option gains about <strong>5.7\u00a2.</strong></p>"},{"id":"19","title":"Vega across the chain","html":"<table><thead><tr><th>Strike</th><th>Vega</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td>0.032</td></tr><tr><td>$47.50</td><td>0.049</td></tr><tr><td><strong>$50</strong></td><td><strong>0.057</strong></td></tr><tr><td>$52.50</td><td>0.052</td></tr><tr><td>$55</td><td>0.039</td></tr><tr><td>$60</td><td>0.013</td></tr></tbody></table><p>Peaks at the money again. Third time today.</p>"},{"id":"20","title":"Vega and the crush, measured","html":"<p>Day 8: volatility fell from 65% to 36%. <strong>29 points.</strong></p><p>At roughly 6\u00a2 per point, that is about <strong>$1.70</strong> of value gone.</p><blockquote>The crush is not mysterious. It is vega multiplied by the drop.</blockquote>"},{"id":"21","title":"Rho","html":"<p><em>Pronounced &quot;row.&quot;</em></p><p>How much the price moves for a 1-point change in interest rates.</p><p>The $50 call: <strong>0.020.</strong> Two cents.</p><blockquote>Real, smallest, last. Know it exists.</blockquote>"},{"id":"22","title":"The whole picture, one contract","html":"<p>NORTH $50 call, 30 days, $2.06.</p><table><thead><tr><th>Greek</th><th>Value</th><th>Means</th></tr></thead><tbody><tr><td></td></tr><tr><td>Delta</td><td>0.52</td><td>Gains 52\u00a2 per $1 rise</td></tr><tr><td>Gamma</td><td>0.077</td><td>Delta rises as NORTH does</td></tr><tr><td>Theta</td><td>\u2212$0.034</td><td>Loses 3.4\u00a2 per day</td></tr><tr><td>Vega</td><td>0.057</td><td>Gains 5.7\u00a2 per volatility point</td></tr><tr><td>Rho</td><td>0.020</td><td>Barely matters</td></tr></tbody></table>"},{"id":"23","title":"Common mistakes","html":"<ul><li>Treating delta as a precise probability</li><li>Assuming delta stays put during a move</li><li>Wanting gamma without paying theta</li><li>Ignoring vega and being surprised by a volatility move</li><li>Chasing high-gamma short-dated options without pricing the decay</li><li>Memorising the Greeks instead of reasoning about them</li></ul>"},{"id":"24","title":"Today, and what's next","html":"<p><strong>Today:</strong></p><ul><li>Delta: exposure, and roughly the chance of finishing in the money</li><li>Gamma: how fast delta shifts. Peaks at the money, explodes near expiry</li><li>Theta: what a day costs. Same curve as gamma</li><li>Gamma is the reward, theta is the rent, and they are inseparable</li><li>Vega: sensitivity to expectations. It explains the crush exactly</li><li>Rho: real, and last</li></ul><p><strong>Foundation complete.</strong> Next: Day 10, and strategy.</p>"}], AU = {"1":"https://wealthorbit.ca/audio/day-09/day-09_slide-1.mp3","10":"https://wealthorbit.ca/audio/day-09/day-09_slide-10.mp3","11":"https://wealthorbit.ca/audio/day-09/day-09_slide-11.mp3","12":"https://wealthorbit.ca/audio/day-09/day-09_slide-12.mp3","13":"https://wealthorbit.ca/audio/day-09/day-09_slide-13.mp3","14":"https://wealthorbit.ca/audio/day-09/day-09_slide-14.mp3","15":"https://wealthorbit.ca/audio/day-09/day-09_slide-15.mp3","16":"https://wealthorbit.ca/audio/day-09/day-09_slide-16.mp3","17":"https://wealthorbit.ca/audio/day-09/day-09_slide-17.mp3","18":"https://wealthorbit.ca/audio/day-09/day-09_slide-18.mp3","19":"https://wealthorbit.ca/audio/day-09/day-09_slide-19.mp3","2":"https://wealthorbit.ca/audio/day-09/day-09_slide-2.mp3","20":"https://wealthorbit.ca/audio/day-09/day-09_slide-20.mp3","21":"https://wealthorbit.ca/audio/day-09/day-09_slide-21.mp3","22":"https://wealthorbit.ca/audio/day-09/day-09_slide-22.mp3","23":"https://wealthorbit.ca/audio/day-09/day-09_slide-23.mp3","24":"https://wealthorbit.ca/audio/day-09/day-09_slide-24.mp3","3":"https://wealthorbit.ca/audio/day-09/day-09_slide-3.mp3","4":"https://wealthorbit.ca/audio/day-09/day-09_slide-4.mp3","5":"https://wealthorbit.ca/audio/day-09/day-09_slide-5.mp3","6":"https://wealthorbit.ca/audio/day-09/day-09_slide-6.mp3","7":"https://wealthorbit.ca/audio/day-09/day-09_slide-7.mp3","8":"https://wealthorbit.ca/audio/day-09/day-09_slide-8.mp3","9":"https://wealthorbit.ca/audio/day-09/day-09_slide-9.mp3"}, KEY = 'wo-day-09';
let i = 0;
const $ = x => document.getElementById(x);

function paint(){
  const s = SL[i];
  $('slide').innerHTML = `<p class="sn">SLIDE ${s.id} / ${SL.length}</p>` +
                         (s.title ? `<h2>${s.title}</h2>` : '') + s.html;
  const src = AU[s.id];
  const au = $('au');
  au.pause();
  if(src){ au.src = src; $('play').disabled = false; }
  else   { au.removeAttribute('src'); $('play').disabled = true; }
  setIcon(false);
  $('fill').style.width = '0%';
  $('time').textContent = '0:00';
  $('prev').disabled = i===0;
  $('next').disabled = i===SL.length-1;
  $('pg').style.width = ((i+1)/SL.length*100)+'%';
  document.querySelectorAll('.dot').forEach((d,n)=>{
    d.className = 'dot' + (n===i?' on':(n<i?' done':''));
  });
  try{ localStorage.setItem(KEY, i); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(n){ if(n>=0 && n<SL.length){ i=n; paint(); } }

SL.forEach((s,n)=>{
  const b=document.createElement('button');
  b.className='dot'; b.textContent=s.id; b.title='Slide '+s.id;
  b.onclick=()=>go(n); $('rail').appendChild(b);
});

$('prev').onclick = ()=>go(i-1);
$('next').onclick = ()=>go(i+1);

const au = $('au');
function setIcon(playing){
  document.querySelector('.i-play').style.display  = playing ? 'none' : '';
  document.querySelector('.i-pause').style.display = playing ? '' : 'none';
  $('play').setAttribute('aria-label', playing ? 'Pause narration' : 'Play narration');
}
function mmss(t){
  if(!isFinite(t)) return '0:00';
  const m = Math.floor(t/60), s2 = Math.floor(t%60);
  return m + ':' + String(s2).padStart(2,'0');
}
$('play').onclick = ()=>{ au.paused ? au.play().catch(()=>{}) : au.pause(); };
au.addEventListener('play',  ()=>setIcon(true));
au.addEventListener('pause', ()=>setIcon(false));
au.addEventListener('timeupdate', ()=>{
  if(au.duration){
    $('fill').style.width = (au.currentTime/au.duration*100)+'%';
    $('time').textContent = mmss(au.duration - au.currentTime);
  }
});
au.addEventListener('loadedmetadata', ()=>{ $('time').textContent = mmss(au.duration); });
$('track').addEventListener('click', e=>{
  if(!au.duration) return;
  const r = $('track').getBoundingClientRect();
  au.currentTime = (e.clientX - r.left) / r.width * au.duration;
});
au.addEventListener('ended', ()=>{
  setIcon(false);
  if($('ap').checked && i<SL.length-1){ go(i+1); setTimeout(()=>au.play().catch(()=>{}),350); }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(i+1);
  if(e.key==='ArrowLeft')  go(i-1);
  if(e.key===' '){ e.preventDefault(); au.paused ? au.play().catch(()=>{}) : au.pause(); }
});
try{ const v=parseInt(localStorage.getItem(KEY)); if(v>0 && v<SL.length) i=v; }catch(e){}
paint();
</script>
