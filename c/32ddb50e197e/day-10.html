<style>
:root{
  --paper:#0B0D11;
  --card:#14181E; --card2:#1B2028; --card-2:#1B2028;
  --rule:#262C34; --rule2:#1C222A; --rule-2:#1C222A;
  --ink:#EAEDF1;
  --ink2:#B6BDC7; --ink-2:#B6BDC7;
  --ink3:#8A93A0; --ink-3:#8A93A0;
  --live:#5B9DFF;
  --up:#3FD68A; --down:#FF6B6B;
  --gold:#D4A94A;
  --hi:#FF6B6B; --mid:#FBBF24; --lo:#3FD68A;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --display:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);
 -webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.94);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topin{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;
 align-items:center;justify-content:space-between;gap:16px}
.back{color:var(--ink3);text-decoration:none;font:500 12px/1 var(--mono);letter-spacing:.08em}
.back:hover{color:var(--ink)}
.sess{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);text-align:right}
.sess b{color:var(--ink);font-weight:600}
.prog{height:2px;background:var(--rule2)}
.prog i{display:block;height:100%;background:var(--live);width:0;transition:width .3s}

.stage{max-width:1080px;margin:0 auto;padding:36px 24px 0}
.slide{background:var(--card);border:1px solid var(--rule);border-radius:10px;
 padding:52px 56px;min-height:440px;display:flex;flex-direction:column;justify-content:center}
.sn{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);margin:0 0 20px}
.slide h2{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:0 0 26px;font-weight:600}
.slide p{margin:0 0 15px;font-size:17px;color:var(--ink2)}
.slide p:last-child{margin-bottom:0}
.slide .shout{font-size:29px;line-height:1.28;font-weight:600;color:var(--ink);
 margin:22px 0;letter-spacing:-.01em}
.slide ul,.slide ol{margin:0 0 16px;padding-left:22px}
.slide li{margin-bottom:11px;font-size:17px;color:var(--ink2)}
.slide li::marker{color:var(--ink3)}
.slide ul li .box{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink3);
 border-radius:3px;margin-right:11px;vertical-align:-1px}
.slide blockquote{margin:22px 0;padding:2px 0 2px 20px;border-left:2px solid var(--live);
 color:var(--ink);font-size:17px}
.slide strong{color:var(--ink);font-weight:600}
.slide code{font-family:var(--mono);font-size:15px;background:var(--rule2);
 padding:2px 6px;border-radius:3px;color:var(--ink)}
.slide table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15.5px}
.slide th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
 color:var(--ink3);padding:0 16px 11px 0;border-bottom:1px solid var(--rule)}
.slide td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.slide tr:last-child td{border-bottom:none}
.slide td strong{color:var(--ink)}

.bar{max-width:1080px;margin:0 auto;padding:20px 24px 8px;display:flex;align-items:center;gap:16px}
audio{display:none}
.play{width:54px;height:54px;flex:none;border-radius:50%;border:none;cursor:pointer;
 background:var(--live);color:#04101f;display:grid;place-items:center;padding:0;
 box-shadow:0 4px 18px rgba(91,157,255,.32);transition:transform .12s,box-shadow .12s}
.play:hover{transform:scale(1.06);box-shadow:0 6px 24px rgba(91,157,255,.45)}
.play:active{transform:scale(.97)}
.play svg{fill:#04101f;pointer-events:none}
.play:disabled{background:var(--rule);box-shadow:none;cursor:default;transform:none}
.play:disabled svg{fill:var(--ink3)}
.track{flex:1;height:6px;background:var(--rule);border-radius:3px;cursor:pointer;position:relative}
.track .fill{height:100%;width:0;background:var(--live);border-radius:3px;transition:width .1s linear}
.time{font:500 13px/1 var(--mono);color:var(--ink3);min-width:42px;text-align:right;
 font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px}
button{background:var(--card);border:1px solid var(--rule);color:var(--ink);
 font:500 15px/1 var(--body);padding:14px 16px;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){background:var(--card2);border-color:var(--ink3)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);
 white-space:nowrap;cursor:pointer;user-select:none}
.auto input{accent-color:var(--live);width:15px;height:15px}

.rail{max-width:1080px;margin:0 auto;padding:14px 24px 60px;display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--rule);background:var(--card);
 color:var(--ink3);font:500 10px/1 var(--mono);cursor:pointer;display:grid;place-items:center}
.dot:hover{border-color:var(--ink3);color:var(--ink)}
.dot.on{background:var(--live);border-color:var(--live);color:#06101f;font-weight:600}
.dot.done{color:var(--ink2);border-color:var(--rule)}
@media(max-width:720px){.slide{padding:32px 24px;min-height:340px}
 .slide h2{font-size:24px}.slide .shout{font-size:22px}.stage{padding:20px 16px 0}
 .bar{flex-wrap:wrap;padding:16px}.rail{padding:12px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const SL = [{"id":"1","title":"Matching outlook to structure","html":"<p>Day 10 of 17</p><p>Strategy begins.</p>"},{"id":"2","title":"Nothing new from here","html":"<p>A spread is <strong>two</strong> options with a relationship.</p><p>An iron condor is <strong>four.</strong></p><p class='shout'>Every strategy ahead is an arrangement of what you already know.</p>"},{"id":"3","title":"A strategy is an opinion, made specific","html":"<p>Every position states four things:</p><ol><li>Where you think the stock goes</li><li>How far</li><li>By when</li><li>What you expect volatility to do</li></ol><blockquote>&quot;It&#x27;ll go up&quot; is not a strategy. It is the first quarter of one.</blockquote>"},{"id":"4","title":"The seven foundations","html":"<table><thead><tr><th></th><th>Structure</th></tr></thead><tbody><tr><td></td></tr><tr><td>1</td><td>Long call</td></tr><tr><td>2</td><td>Long put</td></tr><tr><td>3</td><td>Covered call</td></tr><tr><td>4</td><td>Cash-secured put</td></tr><tr><td>5</td><td>Protective put</td></tr><tr><td>6</td><td>Short call, naked</td></tr><tr><td>7</td><td>Short put, naked</td></tr></tbody></table><p>Everything in Days 11 to 13 is built from these.</p>"},{"id":"5","title":"Long call","html":"<p>Buy the <strong>50 call at $2.10.</strong></p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>Outlook</td><td>Bullish</td></tr><tr><td>Max loss</td><td><strong>$210</strong></td></tr><tr><td>Max gain</td><td>No fixed ceiling</td></tr><tr><td>Break-even</td><td><strong>$52.10</strong></td></tr><tr><td>Time</td><td>Against you</td></tr><tr><td>Volatility</td><td>Rise helps</td></tr></tbody></table>"},{"id":"6","title":"Long put","html":"<p>Buy the <strong>50 put at $2.15.</strong></p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>Outlook</td><td>Bearish</td></tr><tr><td>Max loss</td><td><strong>$215</strong></td></tr><tr><td>Max gain</td><td><strong>$4,785</strong></td></tr><tr><td>Break-even</td><td><strong>$47.85</strong></td></tr><tr><td>Time</td><td>Against you</td></tr><tr><td>Volatility</td><td>Rise helps</td></tr></tbody></table>"},{"id":"7","title":"Covered call","html":"<p>Own 100 at $50. Sell the <strong>55 call at $0.45.</strong></p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>Outlook</td><td>Neutral to mildly bullish</td></tr><tr><td>Max loss</td><td>$4,955 (shares to zero)</td></tr><tr><td>Max gain</td><td><strong>$545</strong> at $55+</td></tr><tr><td>Break-even</td><td><strong>$49.55</strong></td></tr><tr><td>Time</td><td><strong>For you</strong></td></tr><tr><td>Volatility</td><td>Rise hurts</td></tr></tbody></table>"},{"id":"8","title":"Cash-secured put","html":"<p>Sell the <strong>47.50 put at $1.15.</strong> Reserve $4,750.</p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>Outlook</td><td>Neutral to mildly bullish</td></tr><tr><td>Max loss</td><td>$4,635</td></tr><tr><td>Max gain</td><td><strong>$115</strong></td></tr><tr><td>Break-even</td><td><strong>$46.35</strong></td></tr><tr><td>Time</td><td><strong>For you</strong></td></tr><tr><td>Volatility</td><td>Rise hurts</td></tr></tbody></table>"},{"id":"9","title":"Protective put","html":"<p>Own 100 at $50. Buy the <strong>45 put at $0.55.</strong></p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>Outlook</td><td>Bullish, but nervous</td></tr><tr><td>Max loss</td><td><strong>$555</strong></td></tr><tr><td>Max gain</td><td>No fixed ceiling</td></tr><tr><td>Break-even</td><td><strong>$50.55</strong></td></tr><tr><td>Time</td><td>Against you</td></tr><tr><td>Volatility</td><td>Rise helps</td></tr></tbody></table>"},{"id":"10","title":"The two we teach but don't place","html":"<p><strong>Short call, naked.</strong> Max gain $200. Max loss <strong>no ceiling.</strong></p><p><strong>Short put, naked.</strong> Max gain $215. Max loss <strong>$4,785.</strong></p><blockquote>You need to understand who is on the other side of your trades.</blockquote>"},{"id":"11","title":"All seven, side by side","html":"<table><thead><tr><th>Strategy</th><th>Outlook</th><th>Max loss</th><th>Max gain</th><th>Time</th><th>Vol rise</th></tr></thead><tbody><tr><td></td></tr><tr><td>Long call</td><td>Bullish</td><td>$210</td><td>Uncapped</td><td>\u2717</td><td>\u2713</td></tr><tr><td>Long put</td><td>Bearish</td><td>$215</td><td>$4,785</td><td>\u2717</td><td>\u2713</td></tr><tr><td>Covered call</td><td>Neutral/bull</td><td>$4,955</td><td>$545</td><td>\u2713</td><td>\u2717</td></tr><tr><td>Cash-secured put</td><td>Neutral/bull</td><td>$4,635</td><td>$115</td><td>\u2713</td><td>\u2717</td></tr><tr><td>Protective put</td><td>Bullish, nervous</td><td>$555</td><td>Uncapped</td><td>\u2717</td><td>\u2713</td></tr><tr><td>Short call</td><td>Neutral/bear</td><td>Uncapped</td><td>$200</td><td>\u2713</td><td>\u2717</td></tr><tr><td>Short put</td><td>Neutral/bull</td><td>$4,785</td><td>$215</td><td>\u2713</td><td>\u2717</td></tr></tbody></table>"},{"id":"12","title":"Read the two right-hand columns","html":"<p>Every strategy is either:</p><p><strong>Long premium</strong> \u2014 pays rent, wants movement</p><p><strong>Short premium</strong> \u2014 collects rent, wants stillness</p><p class='shout'>There is no third category.</p>"},{"id":"13","title":"The trade-off is always the same","html":"<table><thead><tr><th></th><th>Long premium</th><th>Short premium</th></tr></thead><tbody><tr><td></td></tr><tr><td>Wins</td><td>Rarely, large</td><td>Often, small</td></tr><tr><td>Loses</td><td>Often, small</td><td>Rarely, large</td></tr><tr><td>Time</td><td>Enemy</td><td>Ally</td></tr><tr><td>Needs</td><td>Something to happen</td><td>Nothing to happen</td></tr></tbody></table>"},{"id":"14","title":"Neither is better","html":"<p>Long premium: many small losses, occasional large win.</p><p>Short premium: many small wins, occasional large loss.</p><blockquote>Both can make money. Both can lose money. They fail in <strong>opposite ways</strong>, which is the only reason to prefer one in a given situation.</blockquote>"},{"id":"15","title":"Choosing: start with the four questions","html":"<ol><li><strong>Direction?</strong> Up, down, sideways, no view.</li><li><strong>How far?</strong> A little or a lot.</li><li><strong>By when?</strong> Days, weeks, months.</li><li><strong>Volatility?</strong> Expected to rise, fall, or hold.</li></ol>"},{"id":"16","title":"Bullish views are not all the same","html":"<table><thead><tr><th>Your view</th><th>Structure</th></tr></thead><tbody><tr><td></td></tr><tr><td>Up a lot, soon</td><td>Long call</td></tr><tr><td>Up a little, slowly</td><td>Covered call</td></tr><tr><td>Up eventually, want to buy lower</td><td>Cash-secured put</td></tr><tr><td>Up, but nervous</td><td>Protective put</td></tr></tbody></table>"},{"id":"17","title":"Bearish and neutral","html":"<table><thead><tr><th>Your view</th><th>Structure</th></tr></thead><tbody><tr><td></td></tr><tr><td>Down a lot, soon</td><td>Long put</td></tr><tr><td>Down a little</td><td>Long put, or avoid</td></tr><tr><td>Sideways, own the shares</td><td>Covered call</td></tr><tr><td>Sideways, want the shares</td><td>Cash-secured put</td></tr><tr><td><strong>No view</strong></td><td><strong>No trade</strong></td></tr></tbody></table>"},{"id":"18","title":"The volatility question","html":"<p><strong>Expect volatility to rise?</strong> Long premium benefits.</p><p><strong>Expect volatility to fall?</strong> Short premium benefits.</p><p><strong>Before earnings, volatility is already high.</strong> Buying there means paying for uncertainty that is about to disappear.</p>"},{"id":"19","title":"Worked example","html":"<p><em>You own 100 NORTH at $50. You think it drifts sideways for a month. You&#x27;d sell at $55 happily.</em></p><p><strong>Rejected:</strong> long call <em>(needs a move)</em> \u00b7 long put <em>(wrong direction)</em> \u00b7 protective put <em>(pays for protection you don&#x27;t want)</em></p><p><strong>Chosen:</strong> covered call at $55 for $45.</p>"},{"id":"20","title":"Why \"rejected\" matters","html":"<p>Anyone can name a strategy that fits a view.</p><p class='shout'>Explaining what you rejected is what proves you understand the alternatives.</p><p>From here, every trade decision states both.</p>"},{"id":"21","title":"Common mistakes","html":"<ul><li>Choosing a structure before forming a view</li><li>Treating &quot;bullish&quot; as one outlook</li><li>Ignoring the volatility question entirely</li><li>Believing short premium is safer because it wins more often</li><li>Selling covered calls at strikes you don&#x27;t want to sell at</li><li>Trading when you have no view</li></ul>"},{"id":"22","title":"Today, and what's next","html":"<p><strong>Today:</strong></p><ul><li>Every strategy is an arrangement of the seven foundations</li><li>A strategy states direction, magnitude, timing and volatility</li><li>Everything is long premium or short premium. No third category.</li><li>Long premium: wins rarely and large. Short premium: wins often and small.</li><li>Neither is safer. They fail in opposite ways.</li><li>No view means no trade</li></ul><p><strong>Next: Day 11.</strong> Spreads. Combining two options into one position.</p>"}], AU = {"1":"https://wealthorbit.ca/audio/day-10/day-10_slide-1.mp3","10":"https://wealthorbit.ca/audio/day-10/day-10_slide-10.mp3","11":"https://wealthorbit.ca/audio/day-10/day-10_slide-11.mp3","12":"https://wealthorbit.ca/audio/day-10/day-10_slide-12.mp3","13":"https://wealthorbit.ca/audio/day-10/day-10_slide-13.mp3","14":"https://wealthorbit.ca/audio/day-10/day-10_slide-14.mp3","15":"https://wealthorbit.ca/audio/day-10/day-10_slide-15.mp3","16":"https://wealthorbit.ca/audio/day-10/day-10_slide-16.mp3","17":"https://wealthorbit.ca/audio/day-10/day-10_slide-17.mp3","18":"https://wealthorbit.ca/audio/day-10/day-10_slide-18.mp3","19":"https://wealthorbit.ca/audio/day-10/day-10_slide-19.mp3","2":"https://wealthorbit.ca/audio/day-10/day-10_slide-2.mp3","20":"https://wealthorbit.ca/audio/day-10/day-10_slide-20.mp3","21":"https://wealthorbit.ca/audio/day-10/day-10_slide-21.mp3","22":"https://wealthorbit.ca/audio/day-10/day-10_slide-22.mp3","3":"https://wealthorbit.ca/audio/day-10/day-10_slide-3.mp3","4":"https://wealthorbit.ca/audio/day-10/day-10_slide-4.mp3","5":"https://wealthorbit.ca/audio/day-10/day-10_slide-5.mp3","6":"https://wealthorbit.ca/audio/day-10/day-10_slide-6.mp3","7":"https://wealthorbit.ca/audio/day-10/day-10_slide-7.mp3","8":"https://wealthorbit.ca/audio/day-10/day-10_slide-8.mp3","9":"https://wealthorbit.ca/audio/day-10/day-10_slide-9.mp3"}, KEY = 'wo-day-10';
let i = 0;
const $ = x => document.getElementById(x);

function paint(){
  const s = SL[i];
  $('slide').innerHTML = `<p class="sn">SLIDE ${s.id} / ${SL.length}</p>` +
                         (s.title ? `<h2>${s.title}</h2>` : '') + s.html;
  const src = AU[s.id];
  const au = $('au');
  au.pause();
  if(src){ au.src = src; $('play').disabled = false; }
  else   { au.removeAttribute('src'); $('play').disabled = true; }
  setIcon(false);
  $('fill').style.width = '0%';
  $('time').textContent = '0:00';
  $('prev').disabled = i===0;
  $('next').disabled = i===SL.length-1;
  $('pg').style.width = ((i+1)/SL.length*100)+'%';
  document.querySelectorAll('.dot').forEach((d,n)=>{
    d.className = 'dot' + (n===i?' on':(n<i?' done':''));
  });
  try{ localStorage.setItem(KEY, i); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(n){ if(n>=0 && n<SL.length){ i=n; paint(); } }

SL.forEach((s,n)=>{
  const b=document.createElement('button');
  b.className='dot'; b.textContent=s.id; b.title='Slide '+s.id;
  b.onclick=()=>go(n); $('rail').appendChild(b);
});

$('prev').onclick = ()=>go(i-1);
$('next').onclick = ()=>go(i+1);

const au = $('au');
function setIcon(playing){
  document.querySelector('.i-play').style.display  = playing ? 'none' : '';
  document.querySelector('.i-pause').style.display = playing ? '' : 'none';
  $('play').setAttribute('aria-label', playing ? 'Pause narration' : 'Play narration');
}
function mmss(t){
  if(!isFinite(t)) return '0:00';
  const m = Math.floor(t/60), s2 = Math.floor(t%60);
  return m + ':' + String(s2).padStart(2,'0');
}
$('play').onclick = ()=>{ au.paused ? au.play().catch(()=>{}) : au.pause(); };
au.addEventListener('play',  ()=>setIcon(true));
au.addEventListener('pause', ()=>setIcon(false));
au.addEventListener('timeupdate', ()=>{
  if(au.duration){
    $('fill').style.width = (au.currentTime/au.duration*100)+'%';
    $('time').textContent = mmss(au.duration - au.currentTime);
  }
});
au.addEventListener('loadedmetadata', ()=>{ $('time').textContent = mmss(au.duration); });
$('track').addEventListener('click', e=>{
  if(!au.duration) return;
  const r = $('track').getBoundingClientRect();
  au.currentTime = (e.clientX - r.left) / r.width * au.duration;
});
au.addEventListener('ended', ()=>{
  setIcon(false);
  if($('ap').checked && i<SL.length-1){ go(i+1); setTimeout(()=>au.play().catch(()=>{}),350); }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(i+1);
  if(e.key==='ArrowLeft')  go(i-1);
  if(e.key===' '){ e.preventDefault(); au.paused ? au.play().catch(()=>{}) : au.pause(); }
});
try{ const v=parseInt(localStorage.getItem(KEY)); if(v>0 && v<SL.length) i=v; }catch(e){}
paint();
</script>
