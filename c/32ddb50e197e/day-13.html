<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15. Calendars and diagonals · WealthOrbit Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#0d0f12;--card:#15181d;--card2:#1a1e24;--rule:#242830;--rule2:#1e2229;
 --ink:#e8eaed;--ink2:#b4bbc4;--ink3:#8b939d;--live:#60a5fa;--up:#4ade80;--down:#f87171;
 --mono:'IBM Plex Mono',ui-monospace,monospace;--body:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);
 -webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.94);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topin{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;
 align-items:center;justify-content:space-between;gap:16px}
.back{color:var(--ink3);text-decoration:none;font:500 12px/1 var(--mono);letter-spacing:.08em}
.back:hover{color:var(--ink)}
.sess{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);text-align:right}
.sess b{color:var(--ink);font-weight:600}
.prog{height:2px;background:var(--rule2)}
.prog i{display:block;height:100%;background:var(--live);width:0;transition:width .3s}

.stage{max-width:1080px;margin:0 auto;padding:36px 24px 0}
.slide{background:var(--card);border:1px solid var(--rule);border-radius:10px;
 padding:52px 56px;min-height:440px;display:flex;flex-direction:column;justify-content:center}
.sn{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);margin:0 0 20px}
.slide h2{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:0 0 26px;font-weight:600}
.slide p{margin:0 0 15px;font-size:17px;color:var(--ink2)}
.slide p:last-child{margin-bottom:0}
.slide .shout{font-size:29px;line-height:1.28;font-weight:600;color:var(--ink);
 margin:22px 0;letter-spacing:-.01em}
.slide ul,.slide ol{margin:0 0 16px;padding-left:22px}
.slide li{margin-bottom:11px;font-size:17px;color:var(--ink2)}
.slide li::marker{color:var(--ink3)}
.slide ul li .box{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink3);
 border-radius:3px;margin-right:11px;vertical-align:-1px}
.slide blockquote{margin:22px 0;padding:2px 0 2px 20px;border-left:2px solid var(--live);
 color:var(--ink);font-size:17px}
.slide strong{color:var(--ink);font-weight:600}
.slide code{font-family:var(--mono);font-size:15px;background:var(--rule2);
 padding:2px 6px;border-radius:3px;color:var(--ink)}
.slide table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15.5px}
.slide th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
 color:var(--ink3);padding:0 16px 11px 0;border-bottom:1px solid var(--rule)}
.slide td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.slide tr:last-child td{border-bottom:none}
.slide td strong{color:var(--ink)}

.bar{max-width:1080px;margin:0 auto;padding:20px 24px 8px;display:flex;align-items:center;gap:16px}
audio{flex:1;height:38px}
audio::-webkit-media-controls-panel{background:var(--card)}
.nav{display:flex;gap:8px}
button{background:var(--card);border:1px solid var(--rule);color:var(--ink);
 font:500 14px/1 var(--body);padding:11px 18px;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){background:var(--card2);border-color:var(--ink3)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);
 white-space:nowrap;cursor:pointer;user-select:none}
.auto input{accent-color:var(--live);width:15px;height:15px}

.rail{max-width:1080px;margin:0 auto;padding:14px 24px 60px;display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--rule);background:var(--card);
 color:var(--ink3);font:500 10px/1 var(--mono);cursor:pointer;display:grid;place-items:center}
.dot:hover{border-color:var(--ink3);color:var(--ink)}
.dot.on{background:var(--live);border-color:var(--live);color:#06101f;font-weight:600}
.dot.done{color:var(--ink2);border-color:var(--rule)}
@media(max-width:720px){.slide{padding:32px 24px;min-height:340px}
 .slide h2{font-size:24px}.slide .shout{font-size:22px}.stage{padding:20px 16px 0}
 .bar{flex-wrap:wrap;padding:16px}.rail{padding:12px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="sess">SESSION 15 &middot; <b>Calendars and diagonals</b></div>
  </div>
  <div class="prog"><i id="pg"></i></div>
</div>

<div class="stage">
  <div class="slide" id="slide"></div>
</div>

<div class="bar">
  <div class="nav">
    <button id="prev">&larr; Prev</button>
    <button id="next">Next &rarr;</button>
  </div>
  <audio id="au" controls preload="none"></audio>
  <label class="auto"><input type="checkbox" id="ap" checked> Auto-advance</label>
</div>

<div class="rail" id="rail"></div>

<script>
const SL = [{"id":"1","title":"Calendars and diagonals","html":"<p>Day 13 of 17</p><p>The last structures. And the hardest.</p>"},{"id":"2","title":"One thing changes","html":"<p>Every structure so far: all legs expiring <strong>on the same day.</strong></p><p>Today: legs in <strong>different expirations.</strong></p><p class='shout'>That single change breaks the tool you have been using.</p>"},{"id":"3","title":"You cannot draw the payoff","html":"<p>Every payoff diagram so far showed value <strong>at expiration</strong>, where only intrinsic value survives.</p><p>With two expirations, when the front leg expires the back leg is <strong>still alive</strong> \u2014 and still carries extrinsic value.</p><blockquote>You have to model it, not draw it.</blockquote>"},{"id":"4","title":"The calendar spread","html":"<p>Same strike. Different dates.</p><p><strong>Sell</strong> the 30-day 50 call \u2014 collect $2.06</p><p><strong>Buy</strong> the 60-day 50 call \u2014 pay $2.91</p><p class='shout'>Net debit $0.85 \u2192 $85</p>"},{"id":"5","title":"What you actually own","html":"<p>You sold the <strong>fast-decaying</strong> option and bought the <strong>slow-decaying</strong> one.</p><p>From Day 8: the front month loses value far faster than the back month.</p><blockquote>You are harvesting the difference in decay rates.</blockquote>"},{"id":"6","title":"Thirty days later","html":"<p>The front leg expires. The back leg has <strong>30 days left.</strong></p><table><thead><tr><th>NORTH</th><th>Front owes</th><th>Back worth</th><th>P/L</th></tr></thead><tbody><tr><td></td></tr><tr><td>$42</td><td>$0</td><td>$0.09</td><td><strong>\u2212$76</strong></td></tr><tr><td>$45</td><td>$0</td><td>$0.39</td><td><strong>\u2212$46</strong></td></tr><tr><td>$47</td><td>$0</td><td>$0.84</td><td><strong>\u2212$1</strong></td></tr><tr><td>$50</td><td>$0</td><td>$2.06</td><td><strong>+$121</strong></td></tr><tr><td>$53</td><td>$3.00</td><td>$3.95</td><td><strong>+$10</strong></td></tr><tr><td>$55</td><td>$5.00</td><td>$5.52</td><td><strong>\u2212$33</strong></td></tr><tr><td>$58</td><td>$8.00</td><td>$8.19</td><td><strong>\u2212$66</strong></td></tr></tbody></table>"},{"id":"7","title":"The tent","html":"<p>Maximum profit <strong>$121</strong>, at exactly <strong>$50.</strong></p><p>Falling away in both directions.</p><p>Break-evens <strong>$47.02</strong> and <strong>$53.38</strong> \u2014 a $6.35 band.</p>"},{"id":"8","title":"Notice what's different","html":"<p>Every other structure paid you most <strong>away</strong> from a strike, or across a <strong>flat</strong> plateau.</p><p class='shout'>This one peaks at a single point.</p><p>You want NORTH to finish exactly where it started.</p>"},{"id":"9","title":"Why it peaks at the strike","html":"<p>At $50, the front leg you sold expires <strong>worthless</strong> \u2014 you keep everything.</p><p>And the back leg you own is <strong>at the money</strong>, where extrinsic value is greatest.</p><blockquote>Day 7&#x27;s hump. You want to be sitting on top of it.</blockquote>"},{"id":"10","title":"Maximum loss","html":"<p>Far from the strike, both legs converge in value.</p><p>Your loss approaches \u2014 but never exceeds \u2014 the <strong>debit: $85.</strong></p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>Maximum profit</td><td>$121 at $50</td></tr><tr><td>Maximum loss</td><td>$85</td></tr><tr><td>Break-evens</td><td>$47.02 \u00b7 $53.38</td></tr></tbody></table>"},{"id":"11","title":"And now the surprise","html":"<p>You sold the more expensive-to-decay option and paid a net debit.</p><p>That looks like a short-premium position.</p><p class='shout'>It is long vega.</p><p>A <strong>rise</strong> in implied volatility helps you.</p>"},{"id":"12","title":"The volatility table","html":"<p>NORTH at $50 at front expiration. Only volatility changes.</p><table><thead><tr><th>Back-month volatility</th><th>P/L</th></tr></thead><tbody><tr><td></td></tr><tr><td>25%</td><td><strong>+$58</strong></td></tr><tr><td>30%</td><td>+$86</td></tr><tr><td>36%</td><td>+$121</td></tr><tr><td>45%</td><td>+$172</td></tr><tr><td>55%</td><td><strong>+$229</strong></td></tr></tbody></table>"},{"id":"13","title":"Why long vega","html":"<p>The front leg expires. Its vega goes to <strong>zero.</strong></p><p>The back leg survives, with 30 days left, carrying <strong>all</strong> the remaining vega.</p><blockquote>You are net long the one that outlives the other.</blockquote>"},{"id":"14","title":"So what is a calendar?","html":"<p>A bet on <strong>three</strong> things at once:</p><ol><li>NORTH stays near $50</li><li>Time passes</li><li>Implied volatility <strong>holds or rises</strong></li></ol><blockquote>The most conditional position in this course.</blockquote>"},{"id":"15","title":"The diagonal","html":"<p>Different strike <strong>and</strong> different date.</p><p><strong>Sell</strong> the 30-day 52.50 call \u2014 collect $1.09</p><p><strong>Buy</strong> the 60-day 50 call \u2014 pay $2.91</p><p class='shout'>Net debit $1.82 \u2192 $182</p>"},{"id":"16","title":"Thirty days later","html":"<table><thead><tr><th>NORTH</th><th>P/L</th></tr></thead><tbody><tr><td></td></tr><tr><td>$45</td><td><strong>\u2212$143</strong></td></tr><tr><td>$48</td><td>\u2212$65</td></tr><tr><td>$50</td><td>+$24</td></tr><tr><td>$52.50</td><td><strong>+$177</strong></td></tr><tr><td>$55</td><td>+$120</td></tr><tr><td>$58</td><td>+$87</td></tr><tr><td>$62</td><td><strong>+$72</strong></td></tr></tbody></table>"},{"id":"17","title":"Calendar against diagonal","html":"<table><thead><tr><th></th><th>Calendar</th><th>Diagonal</th></tr></thead><tbody><tr><td></td></tr><tr><td>Peak</td><td>$50</td><td><strong>$52.50</strong></td></tr><tr><td>Cost</td><td>$85</td><td>$182</td></tr><tr><td>At $62</td><td>\u2212$76</td><td><strong>+$72</strong></td></tr><tr><td>View</td><td>Sits still</td><td>Drifts <strong>up</strong></td></tr></tbody></table><p>The diagonal tilts the tent in your favour.</p>"},{"id":"18","title":"What goes wrong","html":"<ul><li><strong>A large move.</strong> Either direction kills a calendar.</li><li><strong>A volatility collapse.</strong> Long vega cuts both ways.</li><li><strong>Early assignment</strong> on the short leg, before the back leg matures.</li><li><strong>Four spreads crossed</strong>, on a structure that risks $85.</li><li><strong>Front and back volatility can differ</strong>, and often do around earnings.</li></ul>"},{"id":"19","title":"Common mistakes","html":"<ul><li>Reading a calendar off an expiration payoff diagram</li><li>Assuming the debit is the only risk without checking assignment</li><li>Placing calendars across an earnings date</li><li>Ignoring that you need volatility to hold up</li><li>Using calendars on illiquid chains</li><li>Treating a diagonal as a calendar with a better price</li></ul>"},{"id":"20","title":"The strategy block is finished","html":"<p><strong>Today:</strong></p><ul><li>Two expirations means the payoff cannot be drawn, only modelled</li><li>The calendar peaks at the strike and loses in both directions</li><li>Maximum loss is the debit; maximum profit exceeded it here</li><li>It is <strong>long vega</strong> despite looking short premium</li><li>Three conditions must hold at once</li><li>The diagonal tilts the tent toward a directional view</li></ul><p><strong>Next: Day 14.</strong> Trade selection. Choosing among everything you now know.</p>"}], AU = {"1":"https://wealthorbit.ca/audio/day-13/day-13_slide-1.mp3","10":"https://wealthorbit.ca/audio/day-13/day-13_slide-10.mp3","11":"https://wealthorbit.ca/audio/day-13/day-13_slide-11.mp3","12":"https://wealthorbit.ca/audio/day-13/day-13_slide-12.mp3","13":"https://wealthorbit.ca/audio/day-13/day-13_slide-13.mp3","14":"https://wealthorbit.ca/audio/day-13/day-13_slide-14.mp3","15":"https://wealthorbit.ca/audio/day-13/day-13_slide-15.mp3","16":"https://wealthorbit.ca/audio/day-13/day-13_slide-16.mp3","17":"https://wealthorbit.ca/audio/day-13/day-13_slide-17.mp3","18":"https://wealthorbit.ca/audio/day-13/day-13_slide-18.mp3","19":"https://wealthorbit.ca/audio/day-13/day-13_slide-19.mp3","2":"https://wealthorbit.ca/audio/day-13/day-13_slide-2.mp3","20":"https://wealthorbit.ca/audio/day-13/day-13_slide-20.mp3","3":"https://wealthorbit.ca/audio/day-13/day-13_slide-3.mp3","4":"https://wealthorbit.ca/audio/day-13/day-13_slide-4.mp3","5":"https://wealthorbit.ca/audio/day-13/day-13_slide-5.mp3","6":"https://wealthorbit.ca/audio/day-13/day-13_slide-6.mp3","7":"https://wealthorbit.ca/audio/day-13/day-13_slide-7.mp3","8":"https://wealthorbit.ca/audio/day-13/day-13_slide-8.mp3","9":"https://wealthorbit.ca/audio/day-13/day-13_slide-9.mp3"}, KEY = 'wo-day-13';
let i = 0;
const $ = x => document.getElementById(x);

function paint(){
  const s = SL[i];
  $('slide').innerHTML = `<p class="sn">SLIDE ${s.id} / ${SL.length}</p>` +
                         (s.title ? `<h2>${s.title}</h2>` : '') + s.html;
  const src = AU[s.id];
  if(src){ $('au').src = src; $('au').style.visibility='visible'; }
  else   { $('au').removeAttribute('src'); $('au').style.visibility='hidden'; }
  $('prev').disabled = i===0;
  $('next').disabled = i===SL.length-1;
  $('pg').style.width = ((i+1)/SL.length*100)+'%';
  document.querySelectorAll('.dot').forEach((d,n)=>{
    d.className = 'dot' + (n===i?' on':(n<i?' done':''));
  });
  try{ localStorage.setItem(KEY, i); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(n){ if(n>=0 && n<SL.length){ i=n; paint(); } }

SL.forEach((s,n)=>{
  const b=document.createElement('button');
  b.className='dot'; b.textContent=s.id; b.title='Slide '+s.id;
  b.onclick=()=>go(n); $('rail').appendChild(b);
});

$('prev').onclick = ()=>go(i-1);
$('next').onclick = ()=>go(i+1);
$('au').addEventListener('ended', ()=>{
  if($('ap').checked && i<SL.length-1){ go(i+1); setTimeout(()=>$('au').play().catch(()=>{}),350); }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(i+1);
  if(e.key==='ArrowLeft')  go(i-1);
  if(e.key===' '){ e.preventDefault(); $('au').paused ? $('au').play() : $('au').pause(); }
});
try{ const v=parseInt(localStorage.getItem(KEY)); if(v>0 && v<SL.length) i=v; }catch(e){}
paint();
</script>
</body>
</html>
