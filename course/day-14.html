<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#0a0c0f;--card:#13161b;--card2:#181c22;--rule:#242830;--rule2:#1e2229;
 --ink:#e8eaed;--ink2:#b0b7c0;--ink3:#7f8892;--live:#5b9dff;--up:#3ddc84;--down:#ff6b6b;
 --mono:'IBM Plex Mono',ui-monospace,monospace;--body:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);
 -webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.94);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topin{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;
 align-items:center;justify-content:space-between;gap:16px}
.back{color:var(--ink3);text-decoration:none;font:500 12px/1 var(--mono);letter-spacing:.08em}
.back:hover{color:var(--ink)}
.sess{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);text-align:right}
.sess b{color:var(--ink);font-weight:600}
.prog{height:2px;background:var(--rule2)}
.prog i{display:block;height:100%;background:var(--live);width:0;transition:width .3s}

.stage{max-width:1080px;margin:0 auto;padding:36px 24px 0}
.slide{background:var(--card);border:1px solid var(--rule);border-radius:10px;
 padding:52px 56px;min-height:440px;display:flex;flex-direction:column;justify-content:center}
.sn{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);margin:0 0 20px}
.slide h2{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:0 0 26px;font-weight:600}
.slide p{margin:0 0 15px;font-size:17px;color:var(--ink2)}
.slide p:last-child{margin-bottom:0}
.slide .shout{font-size:29px;line-height:1.28;font-weight:600;color:var(--ink);
 margin:22px 0;letter-spacing:-.01em}
.slide ul,.slide ol{margin:0 0 16px;padding-left:22px}
.slide li{margin-bottom:11px;font-size:17px;color:var(--ink2)}
.slide li::marker{color:var(--ink3)}
.slide ul li .box{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink3);
 border-radius:3px;margin-right:11px;vertical-align:-1px}
.slide blockquote{margin:22px 0;padding:2px 0 2px 20px;border-left:2px solid var(--live);
 color:var(--ink);font-size:17px}
.slide strong{color:var(--ink);font-weight:600}
.slide code{font-family:var(--mono);font-size:15px;background:var(--rule2);
 padding:2px 6px;border-radius:3px;color:var(--ink)}
.slide table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15.5px}
.slide th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
 color:var(--ink3);padding:0 16px 11px 0;border-bottom:1px solid var(--rule)}
.slide td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.slide tr:last-child td{border-bottom:none}
.slide td strong{color:var(--ink)}

.bar{max-width:1080px;margin:0 auto;padding:20px 24px 8px;display:flex;align-items:center;gap:16px}
audio{flex:1;height:38px}
audio::-webkit-media-controls-panel{background:var(--card)}
.nav{display:flex;gap:8px}
button{background:var(--card);border:1px solid var(--rule);color:var(--ink);
 font:500 14px/1 var(--body);padding:11px 18px;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){background:var(--card2);border-color:var(--ink3)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);
 white-space:nowrap;cursor:pointer;user-select:none}
.auto input{accent-color:var(--live);width:15px;height:15px}

.rail{max-width:1080px;margin:0 auto;padding:14px 24px 60px;display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--rule);background:var(--card);
 color:var(--ink3);font:500 10px/1 var(--mono);cursor:pointer;display:grid;place-items:center}
.dot:hover{border-color:var(--ink3);color:var(--ink)}
.dot.on{background:var(--live);border-color:var(--live);color:#06101f;font-weight:600}
.dot.done{color:var(--ink2);border-color:var(--rule)}
@media(max-width:720px){.slide{padding:32px 24px;min-height:340px}
 .slide h2{font-size:24px}.slide .shout{font-size:22px}.stage{padding:20px 16px 0}
 .bar{flex-wrap:wrap;padding:16px}.rail{padding:12px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  </div>

</div>

  <div class="slide" id="slide"></div>

<div class="bar">
  <div class="nav">
    <button id="prev">&larr; Prev</button>
    <button id="next">Next &rarr;</button>
  </div>

</div>

<script>
const SL = [{"id":"1","title":"Trade selection","html":"<p>Day 14 of 17</p><p>You know every structure. Now: which one, on what, when.</p>"},{"id":"2","title":"Selection is mostly rejection","html":"<p>Most candidates should fail.</p><p class='shout'>A screen that passes everything is not a screen.</p><p>Your job today is building filters that say <strong>no</strong> quickly.</p>"},{"id":"3","title":"The funnel","html":"<ol><li><strong>Market environment</strong> \u2014 is this a normal week?</li><li><strong>The underlying</strong> \u2014 do you have a view?</li><li><strong>Liquidity</strong> \u2014 can you get out?</li><li><strong>Premium</strong> \u2014 is it worth what you&#x27;re taking on?</li><li><strong>Expiration</strong> \u2014 how long?</li><li><strong>Strike</strong> \u2014 how far?</li><li><strong>Events</strong> \u2014 anything scheduled?</li><li><strong>Size</strong> \u2014 how much?</li></ol>"},{"id":"4","title":"Step 1 \u2014 Market environment","html":"<ul><li>Is the broad market calm or disorderly?</li><li>Is index volatility unusually high or low?</li><li>Is anything scheduled this week for the market as a whole?</li></ul><blockquote>Not a forecast. A check on whether normal assumptions apply.</blockquote>"},{"id":"5","title":"Step 2 \u2014 The underlying","html":"<p>You need an actual view, from Day 10&#x27;s four dials.</p><p><strong>Direction \u00b7 Magnitude \u00b7 Timing \u00b7 Volatility</strong></p><p>If you cannot set all four:</p><p class='shout'>No trade.</p>"},{"id":"6","title":"Step 3 \u2014 Liquidity has a veto","html":"<p>Three glances, from Day 6:</p><ol><li>Spread as a <strong>percentage</strong> of the ask</li><li>Volume \u2014 is anyone trading it today?</li><li>Open interest \u2014 does anyone hold it?</li></ol><blockquote>This gate has veto power over everything else. Fail it and nothing else matters.</blockquote>"},{"id":"7","title":"Step 4 \u2014 Is the premium worth it?","html":"<p>The wrong question: <em>&quot;Is implied volatility high?&quot;</em></p><p>The right question: <em>&quot;Is it high <strong>for this stock</strong>?&quot;</em></p><p class='shout'>36% means nothing on its own.</p>"},{"id":"8","title":"Implied volatility rank","html":"<p>Where does today&#x27;s volatility sit within its <strong>own</strong> 52-week range?</p><p class='shout'>(Current \u2212 Low) \u00f7 (High \u2212 Low)</p>"},{"id":"9","title":"Three stocks, identical volatility","html":"<p>All three at <strong>36%</strong> implied volatility today.</p><table><thead><tr><th>Stock</th><th>52-week range</th><th>IV rank</th></tr></thead><tbody><tr><td></td></tr><tr><td>NORTH</td><td>22% \u2013 58%</td><td><strong>39%</strong></td></tr><tr><td>Stock B</td><td>30% \u2013 40%</td><td><strong>60%</strong></td></tr><tr><td>Stock C</td><td>34% \u2013 72%</td><td><strong>5%</strong></td></tr></tbody></table>"},{"id":"10","title":"Read that properly","html":"<p><strong>Stock C</strong> at 36% is near the <strong>bottom</strong> of its range. Its options are cheap for it.</p><p><strong>Stock B</strong> at 36% is near the <strong>top</strong> of its range. Its options are expensive for it.</p><p>Same number. Opposite conclusions.</p><blockquote>Sell premium when it is high <strong>for that stock.</strong> Buy it when it is low.</blockquote>"},{"id":"11","title":"Step 5 \u2014 Expiration","html":"<p>Theta per day, as a <strong>percentage of the premium</strong>. NORTH $50 call, at the money.</p><table><thead><tr><th>Days</th><th>Price</th><th>Theta/day</th><th>As % of premium</th></tr></thead><tbody><tr><td></td></tr><tr><td>90</td><td>$3.56</td><td>2.0\u00a2</td><td>0.55%</td></tr><tr><td>60</td><td>$2.91</td><td>2.4\u00a2</td><td>0.83%</td></tr><tr><td>45</td><td>$2.52</td><td>2.8\u00a2</td><td><strong>1.11%</strong></td></tr><tr><td>30</td><td>$2.06</td><td>3.4\u00a2</td><td><strong>1.67%</strong></td></tr><tr><td>21</td><td>$1.72</td><td>4.1\u00a2</td><td>2.38%</td></tr><tr><td>14</td><td>$1.41</td><td>5.0\u00a2</td><td>3.57%</td></tr><tr><td>7</td><td>$0.99</td><td>7.1\u00a2</td><td><strong>7.14%</strong></td></tr></tbody></table>"},{"id":"12","title":"Why 30 to 45 days","html":"<p><strong>Sellers:</strong> decay is meaningfully accelerating, but gamma is still manageable.</p><p><strong>Buyers:</strong> you are not yet paying the punishing part of the curve.</p><p>Inside 21 days, gamma sharpens fast \u2014 Day 9.</p><blockquote>Not a rule. A trade-off with a visible middle.</blockquote>"},{"id":"13","title":"Step 6 \u2014 Strike, by delta","html":"<p>30-day calls on NORTH at $50.</p><table><thead><tr><th>Strike</th><th>Delta</th><th>Roughly</th><th>Premium</th></tr></thead><tbody><tr><td></td></tr><tr><td>$50</td><td>0.52</td><td>52% chance</td><td>$2.06</td></tr><tr><td>$52.50</td><td>0.34</td><td>34%</td><td>$1.09</td></tr><tr><td>$55</td><td>0.19</td><td>19%</td><td>$0.52</td></tr><tr><td>$57.50</td><td>0.10</td><td>10%</td><td>$0.22</td></tr><tr><td>$60</td><td>0.04</td><td>4%</td><td>$0.09</td></tr></tbody></table>"},{"id":"14","title":"The seller's version","html":"<p>Cash-secured puts, 30 days.</p><table><thead><tr><th>Strike</th><th>Delta</th><th>Premium</th><th>Capital</th><th>Return</th></tr></thead><tbody><tr><td></td></tr><tr><td>$50</td><td>\u22120.48</td><td>$206</td><td>$5,000</td><td><strong>4.12%</strong></td></tr><tr><td>$47.50</td><td>\u22120.29</td><td>$100</td><td>$4,750</td><td>2.10%</td></tr><tr><td>$45</td><td>\u22120.14</td><td>$39</td><td>$4,500</td><td>0.87%</td></tr><tr><td>$42.50</td><td>\u22120.05</td><td>$12</td><td>$4,250</td><td><strong>0.28%</strong></td></tr></tbody></table>"},{"id":"15","title":"Now look at the ratios","html":"<table><thead><tr><th>Step</th><th>Delta falls to</th><th>Return falls to</th></tr></thead><tbody><tr><td></td></tr><tr><td>$50 \u2192 $47.50</td><td>0.61\u00d7</td><td><strong>0.51\u00d7</strong></td></tr><tr><td>$47.50 \u2192 $45</td><td>0.49\u00d7</td><td><strong>0.41\u00d7</strong></td></tr><tr><td>$45 \u2192 $42.50</td><td>0.37\u00d7</td><td><strong>0.32\u00d7</strong></td></tr></tbody></table><p class='shout'>Moving further out cuts your income by more than it cuts your risk.</p>"},{"id":"16","title":"What that means","html":"<p>&quot;Sell far out of the money to be safe&quot; is <strong>not free.</strong></p><p>You give up income slightly <strong>faster</strong> than you shed risk.</p><blockquote>There is no safe strike that pays well. The market prices this correctly.</blockquote>"},{"id":"17","title":"Step 7 \u2014 Events","html":"<ul><li>Earnings date inside the contract&#x27;s life?</li><li>Ex-dividend date, if you are short a call?</li><li>Product announcements, regulatory decisions, court dates?</li></ul><p><strong>Ten seconds. Every trade. No exceptions.</strong></p>"},{"id":"18","title":"Step 8 \u2014 Size","html":"<p>The last gate, and the one that decides whether you survive.</p><p class='shout'>Day 15.</p><p>For now: you must know your <strong>maximum loss</strong> before this question can be answered.</p>"},{"id":"19","title":"For sellers specifically","html":"<ul><li>Premium is <strong>compensation for risk</strong>, not free money</li><li>High probability is not high safety</li><li><strong>Tail risk</strong> \u2014 the rare loss is the one that matters</li><li><strong>Gap risk</strong> \u2014 the market is shut when it happens</li><li>Volatility expansion hurts you while the stock sits still</li></ul>"},{"id":"20","title":"State what you rejected","html":"<p>From Day 10: every decision names the structure chosen <strong>and at least two rejected, with reasons.</strong></p><blockquote>The trades where you cannot articulate a rejection are the trades where you had already decided.</blockquote>"},{"id":"21","title":"Common mistakes","html":"<ul><li>Judging implied volatility in absolute terms</li><li>Picking an expiration by habit rather than by the curve</li><li>Choosing a strike by premium size</li><li>Skipping the events check</li><li>Screening for candidates that pass instead of filters that reject</li><li>Deciding size last, or not at all</li></ul>"},{"id":"22","title":"Today, and what's next","html":"<p><strong>Today:</strong></p><ul><li>Selection is mostly rejection. A screen that passes everything is not a screen.</li><li>Implied volatility rank, not absolute volatility</li><li>30 to 45 days is where the theta trade-off has a visible middle</li><li>Strike selection by delta, reading it as rough probability</li><li>Moving further out cuts income faster than it cuts risk</li><li>The events check takes ten seconds and is never skipped</li></ul><p><strong>Deliverable:</strong> your own pre-trade checklist.</p><p><strong>Next: Day 15.</strong> Risk and position management.</p>"}], AU = {}, KEY = 'wo-day-14';
let i = 0;
const $ = x => document.getElementById(x);

function paint(){
  const s = SL[i];
  $('slide').innerHTML = `<p class="sn">SLIDE ${s.id} / ${SL.length}</p>` +
                         (s.title ? `<h2>${s.title}</h2>` : '') + s.html;
  const src = AU[s.id];
  if(src){ $('au').src = src; $('au').style.visibility='visible'; }
  else   { $('au').removeAttribute('src'); $('au').style.visibility='hidden'; }
  $('prev').disabled = i===0;
  $('next').disabled = i===SL.length-1;
  $('pg').style.width = ((i+1)/SL.length*100)+'%';
  document.querySelectorAll('.dot').forEach((d,n)=>{
    d.className = 'dot' + (n===i?' on':(n<i?' done':''));
  });
  try{ localStorage.setItem(KEY, i); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(n){ if(n>=0 && n<SL.length){ i=n; paint(); } }

SL.forEach((s,n)=>{
  const b=document.createElement('button');
  b.className='dot'; b.textContent=s.id; b.title='Slide '+s.id;
  b.onclick=()=>go(n); $('rail').appendChild(b);
});

$('prev').onclick = ()=>go(i-1);
$('next').onclick = ()=>go(i+1);
$('au').addEventListener('ended', ()=>{
  if($('ap').checked && i<SL.length-1){ go(i+1); setTimeout(()=>$('au').play().catch(()=>{}),350); }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(i+1);
  if(e.key==='ArrowLeft')  go(i-1);
  if(e.key===' '){ e.preventDefault(); $('au').paused ? $('au').play() : $('au').pause(); }
});
try{ const v=parseInt(localStorage.getItem(KEY)); if(v>0 && v<SL.length) i=v; }catch(e){}
paint();
</script>
</body>
</html>
