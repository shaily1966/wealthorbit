<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--paper:#0d0f12;--card:#15181d;--card2:#1a1e24;--rule:#242830;--rule2:#1e2229;
 --ink:#e8eaed;--ink2:#b4bbc4;--ink3:#8b939d;--live:#60a5fa;--up:#4ade80;--down:#f87171;
 --mono:'IBM Plex Mono',ui-monospace,monospace;--body:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);
 -webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.94);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topin{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;
 align-items:center;justify-content:space-between;gap:16px}
.back{color:var(--ink3);text-decoration:none;font:500 12px/1 var(--mono);letter-spacing:.08em}
.back:hover{color:var(--ink)}
.sess{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);text-align:right}
.sess b{color:var(--ink);font-weight:600}
.prog{height:2px;background:var(--rule2)}
.prog i{display:block;height:100%;background:var(--live);width:0;transition:width .3s}

.stage{max-width:1080px;margin:0 auto;padding:36px 24px 0}
.slide{background:var(--card);border:1px solid var(--rule);border-radius:10px;
 padding:52px 56px;min-height:440px;display:flex;flex-direction:column;justify-content:center}
.sn{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);margin:0 0 20px}
.slide h2{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:0 0 26px;font-weight:600}
.slide p{margin:0 0 15px;font-size:17px;color:var(--ink2)}
.slide p:last-child{margin-bottom:0}
.slide .shout{font-size:29px;line-height:1.28;font-weight:600;color:var(--ink);
 margin:22px 0;letter-spacing:-.01em}
.slide ul,.slide ol{margin:0 0 16px;padding-left:22px}
.slide li{margin-bottom:11px;font-size:17px;color:var(--ink2)}
.slide li::marker{color:var(--ink3)}
.slide ul li .box{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink3);
 border-radius:3px;margin-right:11px;vertical-align:-1px}
.slide blockquote{margin:22px 0;padding:2px 0 2px 20px;border-left:2px solid var(--live);
 color:var(--ink);font-size:17px}
.slide strong{color:var(--ink);font-weight:600}
.slide code{font-family:var(--mono);font-size:15px;background:var(--rule2);
 padding:2px 6px;border-radius:3px;color:var(--ink)}
.slide table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15.5px}
.slide th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
 color:var(--ink3);padding:0 16px 11px 0;border-bottom:1px solid var(--rule)}
.slide td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.slide tr:last-child td{border-bottom:none}
.slide td strong{color:var(--ink)}

.bar{max-width:1080px;margin:0 auto;padding:20px 24px 8px;display:flex;align-items:center;gap:16px}
audio{flex:1;height:38px}
audio::-webkit-media-controls-panel{background:var(--card)}
.nav{display:flex;gap:8px}
button{background:var(--card);border:1px solid var(--rule);color:var(--ink);
 font:500 14px/1 var(--body);padding:11px 18px;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){background:var(--card2);border-color:var(--ink3)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);
 white-space:nowrap;cursor:pointer;user-select:none}
.auto input{accent-color:var(--live);width:15px;height:15px}

.rail{max-width:1080px;margin:0 auto;padding:14px 24px 60px;display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--rule);background:var(--card);
 color:var(--ink3);font:500 10px/1 var(--mono);cursor:pointer;display:grid;place-items:center}
.dot:hover{border-color:var(--ink3);color:var(--ink)}
.dot.on{background:var(--live);border-color:var(--live);color:#06101f;font-weight:600}
.dot.done{color:var(--ink2);border-color:var(--rule)}
@media(max-width:720px){.slide{padding:32px 24px;min-height:340px}
 .slide h2{font-size:24px}.slide .shout{font-size:22px}.stage{padding:20px 16px 0}
 .bar{flex-wrap:wrap;padding:16px}.rail{padding:12px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const SL = [{"id":"1","title":"WealthOrbit Trader","html":"<p><strong>Subtitle:</strong> Options Foundations</p><p>Day 1 of 17</p><p>Introduction to financial markets and options</p><p><em>Education only. Not investment advice.</em></p>"},{"id":"2","title":"What this course is","html":"<table><thead><tr><th>This course is</th><th>This course is not</th></tr></thead><tbody><tr><td></td></tr><tr><td>A structured education in how options work</td><td>A signal service</td></tr><tr><td>A framework for risk before reward</td><td>A source of trade recommendations</td></tr><tr><td>A process you build and own</td><td>A promise of returns</td></tr></tbody></table>"},{"id":"3","title":"Where you'll be in seventeen sessions","html":"<p>You will be able to:</p><ul><li>Read a full option chain</li><li>Explain where an option&#x27;s price comes from</li><li>Calculate your maximum loss before you enter</li><li>Match a market view to a structure</li><li>Size a position off risk, not off cash</li><li>Manage a position that moved against you</li><li>Follow a process you wrote yourself</li></ul>"},{"id":"4","title":"The one thing this course does not promise","html":"<p class='shout'>Profitability is not a learning outcome.</p><p>What you will have is a process that lets you understand what happened.</p>"},{"id":"5","title":"The road ahead","html":"<table><thead><tr><th>Days</th><th>Block</th><th>Covers</th></tr></thead><tbody><tr><td></td></tr><tr><td>1\u20133</td><td>Foundations</td><td>Markets, accounts, language</td></tr><tr><td>4\u20136</td><td>Mechanics</td><td>Calls, puts, the option chain</td></tr><tr><td>7\u20139</td><td>Pricing</td><td>Value, decay, volatility, Greeks</td></tr><tr><td>10\u201313</td><td>Strategy</td><td>Single options to multi-leg</td></tr><tr><td>14\u201316</td><td>Judgement</td><td>Selection, risk, process</td></tr><tr><td>17</td><td>Canadian layer</td><td>Accounts, permissions, tax</td></tr></tbody></table><p>Plus two platform labs.</p>"},{"id":"6","title":"What owning a share gives you","html":"<ul><li>No expiry date</li><li>Value can fall to zero, no further</li><li>You can hold indefinitely</li><li><strong>Time passing does nothing to it</strong></li><li>Maximum loss is what you paid</li></ul>"},{"id":"7","title":"What an option gives you","html":"<p>An option is a <strong>contract</strong> between two people about a stock.</p><p>One side receives a <strong>right</strong>, for a limited time.</p><p>The other side accepts an <strong>obligation</strong>, for that same time.</p><p>The one receiving the right <strong>pays</strong>.</p><p>The one accepting the obligation <strong>is paid</strong>.</p>"},{"id":"8","title":"The same idea, without the jargon","html":"<p>A house listed at $700,000. You need sixty days to arrange financing.</p><p>You pay the seller $10,000 for a written agreement: for sixty days, you may buy at $700,000 if you choose.</p><table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td>You hold</td><td>A right</td></tr><tr><td>Seller holds</td><td>An obligation</td></tr><tr><td>The $10,000</td><td>Gone either way</td></tr><tr><td>Agreement ends</td><td>Sixty days</td></tr></tbody></table>"},{"id":"9","title":"Every contract specifies four things","html":"<ol><li><strong>Underlying</strong> \u2014 which stock</li><li><strong>Type</strong> \u2014 right to buy, or right to sell</li><li><strong>Strike</strong> \u2014 the agreed price</li><li><strong>Expiration</strong> \u2014 when it ends</li></ol><p>And one number that moves: <strong>the premium.</strong></p>"},{"id":"10","title":"Rights and obligations are not symmetrical","html":"<table><thead><tr><th></th><th>Buyer</th><th>Seller</th></tr></thead><tbody><tr><td></td></tr><tr><td>Holds</td><td>A right</td><td>An obligation</td></tr><tr><td>Chooses whether to act</td><td>Yes</td><td>No</td></tr><tr><td>Premium</td><td>Pays it</td><td>Receives it</td></tr><tr><td><strong>Maximum loss</strong></td><td><strong>The premium</strong></td><td><strong>Depends. Sometimes large.</strong></td></tr><tr><td><strong>Maximum gain</strong></td><td><strong>Depends</strong></td><td><strong>The premium</strong></td></tr><tr><td>Time passing</td><td>Against them</td><td>For them</td></tr></tbody></table>"},{"id":"11","title":"Why options exist at all","html":"<p>A farmer with a crop three months out faces a price he cannot control.</p><p>A buyer who needs that crop faces the same uncertainty in reverse.</p><p>An agreement fixing the price removes it for both.</p><blockquote><strong>Options exist to transfer risk from someone who doesn&#x27;t want it to someone willing to be paid to carry it.</strong></blockquote>"},{"id":"12","title":"The four reasons people use options","html":"<table><tbody><tr><td></td><td></td></tr><tr><td></td></tr><tr><td><strong>Hedging</strong></td><td>Protecting a position you hold</td></tr><tr><td><strong>Income</strong></td><td>Being paid to accept a defined obligation</td></tr><tr><td><strong>Speculation</strong></td><td>A directional view, limited outlay</td></tr><tr><td><strong>Leverage</strong></td><td>Exposure larger than the cash committed</td></tr></tbody></table>"},{"id":"13","title":"Leverage cuts both ways","html":"<p><strong>NORTH</strong> trades at $50.</p><table><thead><tr><th></th><th>100 shares</th><th>One call contract</th></tr></thead><tbody><tr><td></td></tr><tr><td>Cost</td><td>$5,000</td><td>$200</td></tr><tr><td>If NORTH falls to $45</td><td>Down $500</td><td>Down $200</td></tr><tr><td>As a percentage</td><td><strong>10%</strong></td><td><strong>100%</strong></td></tr><tr><td>You still own</td><td>The shares</td><td>Nothing</td></tr></tbody></table>"},{"id":"14","title":"Why options are harder than stocks","html":"<p><strong>A stock:</strong> you need to be right about direction.</p><p><strong>An option:</strong> you need to be right about</p><ul><li>Direction</li><li>Magnitude</li><li>Timing</li><li>Volatility</li></ul><blockquote>You can be right about direction and still lose everything.</blockquote>"},{"id":"15","title":"The risks","html":"<ul><li><strong>Total loss</strong> of premium is common, not exceptional</li><li><strong>Undefined loss</strong> is possible on some sold positions</li><li><strong>Assignment</strong> can come earlier than expected</li><li><strong>Liquidity</strong> \u2014 a wide market can trap you</li><li><strong>Event risk</strong> \u2014 earnings and news</li><li><strong>Volatility</strong> \u2014 price can move against you while the stock sits still</li><li><strong>Leverage</strong> \u2014 small moves, large outcomes</li><li><strong>Expiration</strong> \u2014 time is fixed and unrecoverable</li></ul>"},{"id":"16","title":"What to realistically expect","html":"<table><thead><tr><th>In year one, expect to</th><th>Do not expect to</th></tr></thead><tbody><tr><td></td></tr><tr><td>Paper trade for a while first</td><td>Replace an income</td></tr><tr><td>Trade small enough that a loss stings but doesn&#x27;t damage</td><td>Compound quickly</td></tr><tr><td>Make mistakes obvious in hindsight</td><td>Find a strategy that works in every market</td></tr><tr><td>Learn more about yourself than the market</td><td></td></tr></tbody></table>"},{"id":"17","title":"Leave these behind today","html":"<table><thead><tr><th>The belief</th><th>The reality</th></tr></thead><tbody><tr><td></td></tr><tr><td>Selling options is passive income</td><td>It&#x27;s payment for accepting risk. Sometimes the risk arrives.</td></tr><tr><td>Limited risk means low risk</td><td>Limited means capped. Capped is often total.</td></tr><tr><td>High premium means a good trade</td><td>High premium means the market expects something.</td></tr><tr><td>High probability means safe</td><td>Nine wins can be undone by one loss.</td></tr><tr><td>Options are leveraged stock</td><td>They respond to time and volatility too.</td></tr></tbody></table>"},{"id":"18","title":"Today, and what's next","html":"<p><strong>Today:</strong></p><ul><li>An option is a contract that transfers risk</li><li>Right and obligation are not mirror images</li><li>Direction, magnitude, timing, volatility</li><li>Limited risk is not low risk</li><li>Profitability is not promised</li></ul><p><strong>Next \u2014 Day 2:</strong> Accounts, permissions, margin, buying power. Then the first platform lab.</p><p><strong>Words for next time:</strong> underlying \u00b7 strike \u00b7 expiration \u00b7 premium \u00b7 assignment \u00b7 buying power \u00b7 margin</p>"}], AU = {"1":""../audio/day-01/day-01_slide-1.mp3","10":""../audio/day-01/day-01_slide-10.mp3","11":""../audio/day-01/day-01_slide-11.mp3","12":""../audio/day-01/day-01_slide-12.mp3","13":""../audio/day-01/day-01_slide-13.mp3","14":""../audio/day-01/day-01_slide-14.mp3","15":""../audio/day-01/day-01_slide-15.mp3","16":""../audio/day-01/day-01_slide-16.mp3","17":""../audio/day-01/day-01_slide-17.mp3","18":""../audio/day-01/day-01_slide-18.mp3","2":""../audio/day-01/day-01_slide-2.mp3","3":""../audio/day-01/day-01_slide-3.mp3","4":""../audio/day-01/day-01_slide-4.mp3","5":""../audio/day-01/day-01_slide-5.mp3","6":""../audio/day-01/day-01_slide-6.mp3","7":""../audio/day-01/day-01_slide-7.mp3","8":""../audio/day-01/day-01_slide-8.mp3","9":""../audio/day-01/day-01_slide-9.mp3"}, KEY = 'wo-day-01';
let i = 0;
const $ = x => document.getElementById(x);

function paint(){
  const s = SL[i];
  $('slide').innerHTML = `<p class="sn">SLIDE ${s.id} / ${SL.length}</p>` +
                         (s.title ? `<h2>${s.title}</h2>` : '') + s.html;
  const src = AU[s.id];
  if(src){ $('au').src = src; $('au').style.visibility='visible'; }
  else   { $('au').removeAttribute('src'); $('au').style.visibility='hidden'; }
  $('prev').disabled = i===0;
  $('next').disabled = i===SL.length-1;
  $('pg').style.width = ((i+1)/SL.length*100)+'%';
  document.querySelectorAll('.dot').forEach((d,n)=>{
    d.className = 'dot' + (n===i?' on':(n<i?' done':''));
  });
  try{ localStorage.setItem(KEY, i); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(n){ if(n>=0 && n<SL.length){ i=n; paint(); } }

SL.forEach((s,n)=>{
  const b=document.createElement('button');
  b.className='dot'; b.textContent=s.id; b.title='Slide '+s.id;
  b.onclick=()=>go(n); $('rail').appendChild(b);
});

$('prev').onclick = ()=>go(i-1);
$('next').onclick = ()=>go(i+1);
$('au').addEventListener('ended', ()=>{
  if($('ap').checked && i<SL.length-1){ go(i+1); setTimeout(()=>$('au').play().catch(()=>{}),350); }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(i+1);
  if(e.key==='ArrowLeft')  go(i-1);
  if(e.key===' '){ e.preventDefault(); $('au').paused ? $('au').play() : $('au').pause(); }
});
try{ const v=parseInt(localStorage.getItem(KEY)); if(v>0 && v<SL.length) i=v; }catch(e){}
paint();
</script>
</body>
</html>
